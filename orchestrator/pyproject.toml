[project]
name = "playbox-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playbox_orchestrator"]
