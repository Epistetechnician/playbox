<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playbox</title>
<style>
:root{color-scheme:light dark;--bg:#151713;--ink:#e5e8dd;--mut:#8b9181;--sig:#cbd8a2}
@media (prefers-color-scheme:light){:root{--bg:#f2f3ee;--ink:#1d2019;--mut:#6b7062;--sig:#6f8236}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{height:100%;display:grid;place-content:center;text-align:center;gap:10px}
.mark{width:28px;height:28px;background:var(--sig);margin:0 auto 8px;border-radius:5px}
h1{margin:0;font-size:17px;font-weight:700}
#s{color:var(--mut);min-height:1.5em}
</style></head>
<body><main><div class="mark"></div><h1>Playbox</h1><div id="s" role="status">Starting the hub…</div></main></body></html>
