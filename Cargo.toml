[workspace]
resolver = "2"
members = ["crates/playbox-core", "crates/playbox-cli", "crates/playbox-net", "crates/playbox-git", "crates/playbox-runner", "crates/playbox-mcp", "crates/playbox-bridge", "crates/playbox-rap"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
blake3 = "1"
ed25519-dalek = "2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
opt-level = 3

# Test and dev builds keep debug info off dependencies: smaller target dir, faster link.
[profile.dev.package."*"]
debug = false
