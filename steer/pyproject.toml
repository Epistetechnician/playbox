[project]
name = "playbox-steer"
version = "0.1.0"
description = "Activation-steering engine for Playbox steer tasks (runs inside the sandbox image)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.5.1",
  "transformers==4.46.3",
  "numpy<2.2",
  "blake3>=0.4",
  "safetensors>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "cryptography>=42"]  # cryptography: tools/make_handoff.py, used by the Rust handoff test

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playbox_steer"]
