[package]
publish = false
name = "playbox-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "playbox-mcp"
path = "src/main.rs"

[dependencies]
playbox-core = { path = "../playbox-core" }
playbox-net = { path = "../playbox-net" }
playbox-git = { path = "../playbox-git" }
playbox-runner = { path = "../playbox-runner" }
ed25519-dalek.workspace = true
blake3.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
serde_json = "1"
anyhow = "1"
