[package]
name = "playbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "playbox"
path = "src/main.rs"

[dependencies]
serde_json = "1"
playbox-core = { path = "../playbox-core" }
ed25519-dalek.workspace = true
playbox-net = { path = "../playbox-net" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
playbox-runner = { path = "../playbox-runner" }
playbox-bridge = { path = "../playbox-bridge" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
playbox-mcp = { path = "../playbox-mcp" }
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
