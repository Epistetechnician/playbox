[package]
name = "playbox-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
playbox-git = { path = "../playbox-git" }
playbox-runner = { path = "../playbox-runner" }
playbox-core = { path = "../playbox-core" }
biscuit-auth = "6.0.0"
libc = "0.2"
url = "2"
sha1 = "0.11"
async-trait = "0.1"

rustls-pki-types = "1"
ed25519-dalek.workspace = true
a2a-lf = "0.4.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iroh-gossip = "0.101.0"
bytes = "1"
blake3.workspace = true
n0-future = "0.3"

[dev-dependencies]
iroh = { version = "1.4", features = ["test-utils"] }
iroh-relay = { version = "1.4", features = ["test-utils", "server"] }
