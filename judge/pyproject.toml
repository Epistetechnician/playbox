[project]
name = "playbox-judge"
version = "0.1.0"
description = "Behavioral measures for steering experiments: an independent sentiment classifier and a local pairwise judge"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.6.0", "transformers==4.53.3", "numpy<2.2", "sentencepiece>=0.2", "protobuf>=4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playbox_judge"]
