[package]
name = "playbox-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
playbox-core = { path = "../crates/playbox-core" }
playbox-net = { path = "../crates/playbox-net" }
playbox-runner = { path = "../crates/playbox-runner" }
a2a = { package = "a2a-lf", version = "0.4.2" }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"

[[bin]]
name = "capability_bind"
path = "fuzz_targets/capability_bind.rs"
test = false
doc = false

[[bin]]
name = "room_state_files"
path = "fuzz_targets/room_state_files.rs"
test = false
doc = false

# Not part of the main workspace: it needs nightly and builds everything with sanitizers.
[workspace]
members = ["."]

[[bin]]
name = "seeds"
path = "seeds.rs"
test = false
doc = false

[[bin]]
name = "wire_frame"
path = "fuzz_targets/wire_frame.rs"
test = false
doc = false
bench = false

