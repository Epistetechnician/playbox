# A pull request that adds a vulnerable or disallowed dependency fails here (GitHub's advisory database; licenses follow deny.toml).
name: dependency-review
on: pull_request
permissions:
  contents: read
jobs:
  review:
    # Needs the Dependency graph repo setting; set repo variable DEPENDENCY_GRAPH=true once it is enabled.
    if: vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
