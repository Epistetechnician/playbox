# Build, checksum and sign a release when a tag like v0.1.0 is pushed.
# Needs the PLAYBOX_RELEASE_KEY secret (hex ed25519 key from `playbox release keygen`) to sign; without it
# the release is published unsigned and install.sh still checks SHA256SUMS.
# Intel macOS is cross-compiled on the Apple-silicon runner (the macos-13 runner is retired).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  verify:
    # A tag must match Cargo.toml and have a changelog section; `playbox release prepare X.Y.Z` makes both.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p playbox-cli -- release check "${GITHUB_REF_NAME#v}"
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, os: darwin, arch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-latest, os: darwin, arch: x86_64, target: x86_64-apple-darwin }
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.target }}
      - name: Build
        env:
          # Pinned into the binary so `playbox update` verifies SHA256SUMS.sig. Set the repository variable to the key's public half.
          PLAYBOX_RELEASE_PUBKEY: ${{ vars.PLAYBOX_RELEASE_PUBKEY }}
        run: cargo build --release -p playbox-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/playbox out/playbox
          tar -czf playbox-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C out playbox
      - uses: actions/upload-artifact@v7
        with:
          name: playbox-${{ matrix.os }}-${{ matrix.arch }}
          path: playbox-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write       # build provenance is signed with the workflow's identity (Sigstore), not a key we hold
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signature
        env:
          PLAYBOX_RELEASE_KEY: ${{ secrets.PLAYBOX_RELEASE_KEY }}
        run: |
          tar -czf dist/playbox-hub.tar.gz --exclude=__pycache__ --exclude='*.pyc' ui     # the dashboard, for the installer's --join / --hub
          cargo install cargo-cyclonedx --locked --version 0.5.7 >/dev/null
          cargo cyclonedx --format json --spec-version 1.5 --override-filename playbox.cdx >/dev/null
          mv crates/playbox-cli/playbox.cdx.json dist/playbox.cdx.json     # SBOM: every crate and version in the binary
          VERSION="${GITHUB_REF_NAME#v}"
          cargo run --release -q -p playbox-cli -- release manifest "$VERSION" dist --out dist/release.json
          cargo run --release -q -p playbox-cli -- release notes "$VERSION" > notes.md
          cd dist
          sha256sum playbox-*.tar.gz release.json playbox.cdx.json > SHA256SUMS
          cd ..
          if [ -n "$PLAYBOX_RELEASE_KEY" ]; then
            cargo run --release -q -p playbox-cli -- release sign dist/SHA256SUMS
          else
            echo "PLAYBOX_RELEASE_KEY not set: publishing without a signature"
          fi
      - name: Attest provenance
        # A signed statement that these exact files were built by this workflow from this commit; `gh attestation verify FILE -R Epistetechnician/playbox`
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.3.0-rc.1 is a pre-release: `playbox update` and install.sh follow "latest", which skips it.
          case "${{ github.ref_name }}" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "${{ github.ref_name }}" dist/* --notes-file notes.md $pre
