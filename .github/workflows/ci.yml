# Tests on every push and pull request. Written from the local commands in README.md and docs/steering.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - run: cargo test --workspace --no-fail-fast
      - if: runner.os == 'Linux'
        run: cargo test --manifest-path desktop/Cargo.toml -p pbd-core --no-fail-fast
      - if: runner.os == 'macOS'
        run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings && cargo test --manifest-path desktop/Cargo.toml --workspace --no-fail-fast
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - run: cargo install cargo-audit --locked
      - run: cargo audit  # .cargo/audit.toml lists the reviewed exceptions
  supply-chain:
    # Licences, banned crates, registry sources and advisories (deny.toml). `audit` above is the advisory check with the reviewed exceptions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [steer, judge, orchestrator, world]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - working-directory: ${{ matrix.project }}
        # judge/tests/test_measures.py and test_fear.py load real Hugging Face classifiers and a language model; on a 2-core runner it
        # was killed after ~20 minutes. It runs locally (`cd judge && uv run --group dev pytest -q`), not here.
        run: uv run --group dev pytest -q ${{ matrix.project == 'judge' && '--ignore=tests/test_measures.py --ignore=tests/test_fear.py' || '' }}
  runhygiene:
    # Reproducibility lint for experiment scripts (tools/runhygiene): unseeded or global RNG, swallowed errors. Stdlib only. Triaged
    # findings live in tools/runhygiene/baseline.txt with a reason each; a baseline entry that no longer matches also fails.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tools/runhygiene -q
      - run: python tools/runhygiene/runhygiene.py challenge steer tools judge conformance scripts ui orchestrator --exclude '*/hermes_*/*' --baseline tools/runhygiene/baseline.txt --check
  confine:
    # Linux confinement of the libkrun helper (crates/playbox-runner: jail, cgroup, network filter). It needs what a macOS runner and
    # Docker Desktop's kernel lack: cgroup v2 as root, user namespaces, and nftables with cgroup matching. Skips fail here.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: cargo test -p playbox-runner --lib netpolicy
      - run: cargo test -p playbox-runner --test confine --no-run
      - name: as root (jail, cgroup limits, network filter)
        run: |
          BIN=$(ls -t target/debug/deps/confine-* | grep -v '\.d$' | head -1)
          sudo env PLAYBOX_CONFINE_REQUIRE_ALL=1 PLAYBOX_TEST_CGROUP_BASE=/ "$BIN"
      - name: rootless (jail only)
        run: |
          BIN=$(ls -t target/debug/deps/confine-* | grep -v '\.d$' | head -1)
          PLAYBOX_CONFINE_REQUIRE_ALL=1 PLAYBOX_CONFINE_ONLY=jail "$BIN"
  krun:
    # The libkrun runner against a real microVM: the boot tests, the escape drill (13 probes that must all fail to get out) and the
    # confinement around a real guest. They skip where there is no /dev/kvm, libkrun or Docker, so every skip is a failure here.
    # GitHub's Linux runners expose /dev/kvm once the udev rule below lets everyone use it. libkrun is built once and cached.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIBKRUN_TAG: v1.19.7
      LIBKRUNFW_TAG: v5.6.2
      PLAYBOX_CONFINE_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - name: /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: libkrun and libkrunfw (cached)
        id: krun-cache
        uses: actions/cache@v4
        with:
          path: ~/krun
          key: krun-${{ runner.arch }}-${{ env.LIBKRUN_TAG }}-${{ env.LIBKRUNFW_TAG }}
      - name: Build libkrun and libkrunfw
        if: steps.krun-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libelf-dev python3-pyelftools patchelf libclang-dev pkg-config
          git clone --depth 1 --branch "$LIBKRUNFW_TAG" https://github.com/containers/libkrunfw "$RUNNER_TEMP/libkrunfw"
          (cd "$RUNNER_TEMP/libkrunfw" && make -j"$(nproc)")
          (cd "$RUNNER_TEMP/libkrunfw" && make install PREFIX="$HOME/krun")
          git clone --depth 1 --branch "$LIBKRUN_TAG" https://github.com/containers/libkrun "$RUNNER_TEMP/libkrun"
          (cd "$RUNNER_TEMP/libkrun" && PKG_CONFIG_PATH="$HOME/krun/lib64/pkgconfig:$HOME/krun/lib/pkgconfig" make -j"$(nproc)")
          (cd "$RUNNER_TEMP/libkrun" && make install PREFIX="$HOME/krun")
      - name: Build the helper
        run: |
          find "$HOME/krun" -name 'libkrun*'
          LIB=$(dirname "$(find "$HOME/krun" -name 'libkrun.so*' | head -1)")
          # The helper's environment is its own, so find libkrun and libkrunfw through the system's library cache, not LD_LIBRARY_PATH.
          find "$HOME/krun" -name '*.so*' -printf '%h\n' | sort -u | sudo tee /etc/ld.so.conf.d/krun.conf
          sudo ldconfig
          ldconfig -p | grep -E 'libkrun'
          # The jail binds the directories on LD_LIBRARY_PATH that hold libkrunfw, so list every library directory, not only libkrun's.
          ALL=$(find "$HOME/krun" -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)
          echo "LIB=$ALL" >> "$GITHUB_ENV"
          echo "LIBKRUN_LIB_DIR=$LIB" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ALL" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LIB" >> "$GITHUB_ENV"
          LIBRARY_PATH=$LIB LIBKRUN_LIB_DIR=$LIB cargo build -p playbox-runner --features krun --bin playbox-krun-helper
          echo "PLAYBOX_KRUN_HELPER=$PWD/target/debug/playbox-krun-helper" >> "$GITHUB_ENV"
      - run: docker pull alpine:3
      - run: cargo test -p playbox-runner --test krun --test escape
      - name: the confinement around a real guest, as root
        run: |
          cargo test -p playbox-runner --test confine_guest --no-run
          BIN=$(ls -t target/debug/deps/confine_guest-* | grep -v '\.d$' | head -1)
          sudo env PLAYBOX_CONFINE_REQUIRE_ALL=1 PLAYBOX_KRUN_HELPER="$PLAYBOX_KRUN_HELPER" LD_LIBRARY_PATH="$LIB" "$BIN" --test-threads=1
  lint:
    # Formatting and clippy over the whole workspace, every target, warnings as errors.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path desktop/Cargo.toml -p pbd-core --all-targets -- -D warnings
      - run: python3 -I desktop/scripts/test_stage.py
  f3:
    # The F3 verified hill-climb: harness, verifier and the live room's gate (challenge/f3/tests), then the recorded run re-derived
    # from its receipts, which is what scripts/demo.sh shows. The slow tests re-train a candidate on CPU and run here too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the verifier checks that PROTOCOL.md was committed before each genesis receipt, from history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cryptography numpy pytest tiktoken pyarrow requests torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pytest challenge/f3/tests -q
      - run: python challenge/f3/verify.py --work docs/f3/dry_run --host-pubkey "$(cat docs/f3/dry_run/host.pub)" | tail -3
  conformance:
    # Black-box scenarios against the built `playbox` and `playbox-mcp` binaries (conformance/). The fast tier runs on every push;
    # the full tier (docker tasks, secrets) runs locally with `python3 conformance/run.py --tier full`.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p playbox-cli -p playbox-mcp
      - name: Build the previous release for the version-skew scenario
        run: |
          # The newest tag below the one being built (for a tag build) or the newest tag (for a push): the release users have now.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | while read -r t; do [ "$(git rev-parse "$t^{commit}")" != "$(git rev-parse HEAD)" ] && echo "$t" && break; done)
          echo "previous release: $PREV"
          git worktree add ../prev "$PREV"
          (cd ../prev && cargo build -p playbox-mcp -p playbox-cli --target-dir "$RUNNER_TEMP/prev-target")
          echo "PLAYBOX_OLD_BIN=$RUNNER_TEMP/prev-target/debug" >> "$GITHUB_ENV"
      - run: python3 conformance/trace.py   # every shipped requirement in docs/requirements.md has a check that names it
      - run: CONFORMANCE_REQUIRE_ALL=1 python3 conformance/run.py
  ui:
    # The cockpit's end-to-end check: two UI servers (host and guest) driven over HTTP like the browser does, each with a real
    # playbox-mcp sidecar. A separate job so a failure here does not hide the results of the others.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p playbox-mcp -p playbox-cli
      - run: PLAYBOX_MCP="$PWD/target/debug/playbox-mcp" python3 ui/e2e.py
      # The hub: passkeys, sessions, invites, tunnel flags, and install.sh --join against a local mirror (needs the debug binaries on PATH).
      - run: PATH="$PWD/target/debug:$PATH" PLAYBOX_MCP="$PWD/target/debug/playbox-mcp" python3 ui/tests/test_hub.py
      - run: PATH="$PWD/target/debug:$PATH" PLAYBOX_MCP="$PWD/target/debug/playbox-mcp" python3 ui/tests/test_install.py
      - run: python3 ui/tests/test_bind.py
      - run: python3 ui/tests/test_desktop_signin.py
      - run: python3 ui/tests/test_archive.py
      - run: python3 ui/tests/test_sidecar_timeout.py
      - run: node ui/tests/sw_sim.js
      - run: node ui/tests/qr_sim.js
      - run: node ui/tests/md_sim.js
      # The Research view's JSON is generated from docs/benchmark.md and docs/f3/pilot/: fail when it has drifted from its sources.
      - run: python3 scripts/gen_research.py --check
      - run: node ui/tests/session_watch_sim.js
      # Headless Chrome (already on the runner) through Playwright: sign-in, Settings and a theme, Notes markdown safety, Research list and run.
      - run: pip install playwright && PLAYBOX_SMOKE_REQUIRE=1 python3 ui/tests/smoke.py
  witness:
    # The Hermes witness plugin has plain unittest tests (pytest cannot collect them: the plugin directory is a package).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s hermes-plugin-witness/tests -v
  lean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
