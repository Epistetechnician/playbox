# Tests on every push and pull request. Not yet run on GitHub: written from the local commands in README.md and
# docs/steering.md, so expect to fix the first run (Docker-gated and network-gated tests especially).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - run: cargo install cargo-audit --locked
      - run: cargo audit  # .cargo/audit.toml lists the reviewed exceptions
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        project: [steer, judge, orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: ${{ matrix.project }}
        run: uv run --group dev pytest -q
  lean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
