# Tests on every push and pull request. Written from the local commands in README.md and docs/steering.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - run: cargo install cargo-audit --locked
      - run: cargo audit  # .cargo/audit.toml lists the reviewed exceptions
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [steer, judge, orchestrator, world]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: ${{ matrix.project }}
        # judge/tests/test_measures.py and test_fear.py load real Hugging Face classifiers and a language model; on a 2-core runner it
        # was killed after ~20 minutes. It runs locally (`cd judge && uv run --group dev pytest -q`), not here.
        run: uv run --group dev pytest -q ${{ matrix.project == 'judge' && '--ignore=tests/test_measures.py --ignore=tests/test_fear.py' || '' }}
  confine:
    # Linux confinement of the libkrun helper (crates/playbox-runner: jail, cgroup, network filter). It needs what a macOS runner and
    # Docker Desktop's kernel lack: cgroup v2 as root, user namespaces, and nftables with cgroup matching. Skips fail here.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: cargo test -p playbox-runner --lib netpolicy
      - run: cargo test -p playbox-runner --test confine --no-run
      - name: as root (jail, cgroup limits, network filter)
        run: |
          BIN=$(ls -t target/debug/deps/confine-* | grep -v '\.d$' | head -1)
          sudo env PLAYBOX_CONFINE_REQUIRE_ALL=1 PLAYBOX_TEST_CGROUP_BASE=/ "$BIN"
      - name: rootless (jail only)
        run: |
          BIN=$(ls -t target/debug/deps/confine-* | grep -v '\.d$' | head -1)
          PLAYBOX_CONFINE_REQUIRE_ALL=1 PLAYBOX_CONFINE_ONLY=jail "$BIN"
  conformance:
    # Black-box scenarios against the built `playbox` and `playbox-mcp` binaries (conformance/). The fast tier runs on every push;
    # the full tier (docker tasks, secrets) runs locally with `python3 conformance/run.py --tier full`.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p playbox-cli -p playbox-mcp
      - run: CONFORMANCE_REQUIRE_ALL=1 python3 conformance/run.py
  ui:
    # The cockpit's end-to-end check: two UI servers (host and guest) driven over HTTP like the browser does, each with a real
    # playbox-mcp sidecar. A separate job so a failure here does not hide the results of the others.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p playbox-mcp -p playbox-cli
      - run: PLAYBOX_MCP="$PWD/target/debug/playbox-mcp" python3 ui/e2e.py
      # The hub: passkeys, sessions, invites, tunnel flags, and install.sh --join against a local mirror (needs the debug binaries on PATH).
      - run: PATH="$PWD/target/debug:$PATH" PLAYBOX_MCP="$PWD/target/debug/playbox-mcp" python3 ui/tests/test_hub.py
      - run: PATH="$PWD/target/debug:$PATH" PLAYBOX_MCP="$PWD/target/debug/playbox-mcp" python3 ui/tests/test_install.py
      - run: node ui/tests/sw_sim.js
  witness:
    # The Hermes witness plugin has plain unittest tests (pytest cannot collect them: the plugin directory is a package).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s hermes-plugin-witness/tests -v
  lean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
