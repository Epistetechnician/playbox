<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E7E0" id="themecolor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Playbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Playbox</title>
<script>/* theme before paint, so there is no flash */
try { const t = localStorage.getItem("pb.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
/* Playbox: paper, ink, one signal colour. Orange only ever means "look here". Light and dark come from the same tokens. */
:root{
  color-scheme:light dark;
  --bg:light-dark(#E9E7E0,#0F0F0E);        --panel:light-dark(#F4F2EC,#171715);      --panel-2:light-dark(#ECEAE2,#1F1F1C);   --field:light-dark(#FBFAF7,#0F0F0E);
  --ink:light-dark(#171715,#ECE9E0);        --ink-2:light-dark(#3B3A36,#C6C3B8);     --mut:light-dark(#68665D,#8F8C80);
  --dim:light-dark(#D9D6CB,#2A2A26);        --grid:light-dark(rgba(23,23,21,.07),rgba(236,233,224,.045));
  --line:light-dark(#D5D2C7,#2A2A26);       --line-2:light-dark(#B9B5A8,#3F3E38);    --edge:light-dark(#171715,#6C6A5F);
  --sig:light-dark(#FF5A1F,#FF6B2C);        --sig-ink:light-dark(#B83A0A,#FF8A55);   --on-sig:light-dark(#171715,#0F0F0E);
  --ok:light-dark(#17783F,#4CC380);         --ok-led:light-dark(#1FA458,#4CC380);    --bad:light-dark(#C0143C,#FF4D6D);
  --hard:light-dark(5px 5px 0 #171715,5px 5px 0 #000);                               --scrim:light-dark(rgba(23,23,21,.5),rgba(0,0,0,.65));
  --r:2px; --nav-h:58px; --strip:38px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue","Neue Haas Grotesk",Helvetica,Arial,system-ui,sans-serif;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:22px 22px}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h2{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
a{color:var(--ink)}
.mut{color:var(--mut)} .mono{font-family:var(--mono);font-size:12.5px}
.lbl{font:600 10.5px/1.2 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
[hidden]{display:none!important}
kbd{font:600 10.5px var(--mono);padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;color:var(--mut);background:var(--panel);border-radius:2px}
svg{max-width:100%}

/* ---------- dot-matrix + pixel identity ---------- */
.dm{display:block;height:44px;width:auto}
.dm .on{fill:var(--ink)} .dm .off{fill:var(--dim)}
.sigil{display:block;background:var(--panel-2);border:1px solid var(--line-2);flex:none}
.sigil path{fill:var(--ink)}
.led{display:inline-block;width:8px;height:8px;background:var(--dim);border:1px solid var(--line-2);flex:none}
.led.live{background:var(--ok-led);border-color:var(--ok-led);animation:blink 2s steps(1) infinite}
.led.hold{background:var(--sig);border-color:var(--sig);animation:blink .8s steps(1) infinite}
.led.bad{background:var(--bad);border-color:var(--bad)}
.led.idle{background:var(--mut);border-color:var(--mut)}
.led.empty,.led.down{background:none}
@keyframes blink{50%{opacity:.25}}

/* ---------- layout ---------- */
.shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.rail,.pane{display:none}
.col{min-width:0;display:flex;flex-direction:column}
.strip{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;height:calc(var(--strip) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;
  background:var(--bg);border-bottom:1px solid var(--edge);font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.strip .brand{display:block;line-height:0}
.strip .brand .dm{height:14px}
.strip .state{display:inline-flex;align-items:center;gap:8px}
.strip .hot{color:var(--sig-ink)}
.strip .sp,.sp{flex:1}
#clock{color:var(--mut);min-width:58px;text-align:right}
.iconbtn{width:28px;height:28px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);border-radius:var(--r)}
.iconbtn:hover{border-color:var(--edge);color:var(--ink)}
.iconbtn svg,.tab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:18px 14px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom))}
.hide-s{display:none}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--nav-h);background:none;border:0;border-right:1px solid var(--line);cursor:pointer;
  color:var(--mut);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.tab:last-child{border-right:0}
.tab .ix{display:none}
.tab[aria-current=page]{color:var(--ink);box-shadow:inset 0 3px 0 var(--sig)}
.badge{min-width:17px;height:17px;background:var(--sig);color:var(--on-sig);font:700 10px/17px var(--mono);padding:0 4px;text-align:center}
.bottom .badge{position:absolute;top:6px;right:calc(50% - 26px)}
@media(min-width:820px){
  .shell{grid-template-columns:208px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;padding:18px 16px;border-right:1px solid var(--edge)}
  .rail .brand{display:block;line-height:0;padding:4px 0 2px}
  .rail .brand .dm{height:21px}
  .rail nav{display:grid;gap:2px}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:10px;min-height:36px;padding:0 10px;border:0;font-size:11px;box-shadow:none}
  .rail .tab svg{display:none} .rail .tab .ix{display:inline;color:var(--sig-ink)}
  .rail .tab:hover{background:var(--panel-2);color:var(--ink)}
  .rail .tab[aria-current=page]{background:var(--ink);color:var(--bg)} .rail .tab[aria-current=page] .ix{color:var(--sig)}
  .rail .badge{margin-left:auto}
  .rail .foot{margin-top:auto;display:grid;gap:10px}
  .rail .keys{font:600 10px/1.9 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .bottom,.strip .brand{display:none}
  .hide-s{display:inline}
  main{padding:26px 30px 60px}
  .strip{padding-left:30px;padding-right:30px}
  .toasts{bottom:24px!important}
}
@media(min-width:1380px){
  .shell{grid-template-columns:208px minmax(0,1fr) 336px}
  .pane{display:block;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--edge)}
  .inline-act{display:none}
}
@media(hover:none){.rail .keys,.hint{display:none}}

/* ---------- surfaces ---------- */
.view.enter{animation:in .16s steps(4)}
@keyframes in{from{opacity:.35}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:16px}
.card>h2:first-child{margin:-16px -16px 14px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.sect{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 12px}
.sect:first-child{margin-top:0}
.sect.tools{flex-wrap:wrap;margin:22px 0 12px}
h2.rule{display:flex;align-items:center;gap:12px;flex:1}
h2.rule::after{content:"";flex:1;height:1px;background:var(--line-2)}
h2.rule .ix{color:var(--sig-ink)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;border-radius:var(--r);
  font:600 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;box-shadow:0 2px 0 var(--edge);transition:none}
.btn:hover{background:var(--panel-2)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--sig);color:var(--on-sig)} .btn.primary:hover{background:color-mix(in srgb,var(--sig) 88%,var(--ink))}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.btn.sm{min-height:32px;padding:0 11px;font-size:10.5px}
a.btn{text-decoration:none} .btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none;transform:none}
label{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
input,textarea,select{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line-2);background:var(--field);border-radius:var(--r)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sig);outline-offset:0;border-color:var(--edge)}
textarea{min-height:84px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--line-2);color:var(--mut);white-space:nowrap;border-radius:2px}
.chip.mine{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.shared{color:var(--ink-2);border-color:var(--ink-2)}
.chip.warn{color:var(--sig-ink);border-color:var(--sig-ink)} .chip.bad{color:var(--bad);border-color:var(--bad)} .chip.ok{color:var(--ok);border-color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line-2)} .stat:last-child{border:0;padding-bottom:0}
.empty{text-align:center;color:var(--mut);padding:44px 16px}
.empty .sigil{margin:0 auto 14px}
.empty h2{color:var(--ink);margin-bottom:6px}
.shield{display:inline-flex;align-items:center;gap:4px}
.shield svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:square}

/* ---------- readouts ---------- */
.readout{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2);border:1px solid var(--edge)}
@media(min-width:760px){.readout{grid-template-columns:repeat(4,1fr)}}
.readout::before,.readout::after{content:"+";position:absolute;font:11px/1 var(--mono);color:var(--mut);pointer-events:none}
.readout::before{left:-9px;top:-9px} .readout::after{right:-9px;bottom:-9px}
.cell{display:block;width:100%;padding:12px 14px 13px;background:var(--panel);text-align:left;border:0;color:inherit;font:inherit;cursor:default;border-radius:0}
.cell .dmv{margin:12px 0 11px}
.cell .dm{height:36px}
.cell .sub{font:500 11px var(--mono);color:var(--mut);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.hot .dm .on{fill:var(--sig)} .cell.ok .dm .on{fill:var(--ok-led)} .cell.bad .dm .on{fill:var(--bad)}
button.cell{cursor:pointer} button.cell:hover{background:var(--panel-2)}
@media(min-width:760px){.cell .dm{height:44px}}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--edge);background:var(--panel);border-radius:var(--r)}
.seg button{border:0;background:none;padding:0 12px;min-height:32px;cursor:pointer;color:var(--mut);font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.filters button{border:1px solid var(--line-2);background:none;color:var(--mut);padding:0 11px;min-height:32px;cursor:pointer;white-space:nowrap;border-radius:var(--r);font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.filters button:hover{border-color:var(--edge);color:var(--ink)}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- ledger (rooms): columns respond to the ledger's own width, not the screen's ---------- */
.ledger{container-type:inline-size;border:1px solid var(--edge);background:var(--panel)}
.rw{position:relative;border-top:1px solid var(--line)}
.ledger>.rw:first-child,.lh+.rw{border-top:0}
.rw>a,.lh{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:0 14px;align-items:center}
.rw>a{padding:12px 46px 12px 14px;color:inherit;text-decoration:none}
.rw:hover,.rw.sel{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--ink)}
.rw.hold{background:color-mix(in srgb,var(--sig) 9%,var(--panel));box-shadow:inset 3px 0 0 var(--sig)}
.rw.bad{box-shadow:inset 3px 0 0 var(--bad)}
.rw>a:focus-visible{outline-offset:-2px}
.nm{min-width:0;display:grid;gap:2px}
.nm b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .sub{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .last{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .last b{font:inherit;color:var(--ink);font-weight:500}
.nm .last i{display:inline-block;width:3px;height:11px;background:var(--sig);margin-right:7px;vertical-align:-1px}
.nm .last.warn{color:var(--sig-ink)} .nm .last.bad{color:var(--bad)}
.mt,.pl,.tm,.lh,.stt{display:none}
.st{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.st.live{color:var(--ok)} .st.hold{color:var(--sig-ink)} .st.bad{color:var(--bad)}
.unread{background:var(--sig);color:var(--on-sig);font:700 10px/16px var(--mono);min-width:18px;height:16px;padding:0 4px;text-align:center}
.kebab{position:absolute;right:8px;top:50%;margin-top:-16px;width:32px;height:32px;border:1px solid transparent;background:none;color:var(--mut);cursor:pointer;font-size:18px;line-height:1;border-radius:var(--r)}
.kebab:hover{border-color:var(--edge);color:var(--ink);background:var(--panel)}
.meter{display:block;width:96px;height:15px}
.meter .off{fill:var(--dim)}
.lh{padding:8px 46px 8px 14px;border-bottom:1px solid var(--edge);background:var(--panel-2);font:600 10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.lh .h-room{grid-column:1/3} .lh .h-who,.lh .h-seen{display:none} .lh .h-seen{text-align:right}
.hint{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 2px 0}
@container (min-width:560px){
  .rw>a,.lh{grid-template-columns:36px minmax(0,1fr) 126px 96px}
  .lh{display:grid}
  .pl{display:block} .st{justify-content:flex-start} .stt{display:inline} .nm .sub .s-st{display:none}
}
@container (min-width:900px){
  .rw>a,.lh{grid-template-columns:36px minmax(0,1fr) 190px 126px 96px 38px}
  .mt{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .tm{display:block;text-align:right;font:500 11px var(--mono);color:var(--mut)}
  .nm .sub{display:none}
  .lh .h-who,.lh .h-seen{display:block}
}

/* ---------- radar ---------- */
.const-wrap{position:relative;border:1px solid var(--edge);background:var(--panel)}
.const{position:relative;display:block;width:100%;height:auto;max-height:74vh;touch-action:manipulation}
.const .orbit{fill:none;stroke:var(--line-2)}
.const .tick{stroke:var(--line-2)} .const .tick.maj{stroke:var(--mut)}
.const .cross{stroke:var(--line-2);stroke-dasharray:1 5}
.const .olabel{fill:var(--mut);font:600 9px var(--mono);letter-spacing:.16em}
.const .edge{stroke:var(--line-2);stroke-width:1}
.const a{cursor:pointer;outline:none}
.node .frame{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.node .halo{fill:none;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.node.live .frame{stroke:var(--ok-led);stroke-width:2.5} .node.live .halo{stroke:var(--ok-led);opacity:.9;animation:halo 2.4s steps(6) infinite}
.node.hold .frame{stroke:var(--sig);stroke-width:3} .node.hold .halo{stroke:var(--sig);opacity:1;animation:halo 1s steps(5) infinite}
.node.bad .frame{stroke:var(--bad);stroke-width:2.5} .node.idle .frame{stroke:var(--mut)}
.node.empty .frame,.node.down .frame{stroke:var(--line-2);stroke-dasharray:3 3}
.node:hover .frame,.node:focus-visible .frame{stroke-width:3.5}
.node text{fill:var(--ink);font:600 9px var(--mono);letter-spacing:.08em;text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.node .sub{fill:var(--mut);font-size:8.5px;font-weight:500}
.node .nb{fill:var(--sig)} .node .nbt{fill:var(--on-sig);stroke:none;font:700 9px var(--mono)}
.me .frame{fill:var(--ink);stroke:var(--ink)}
.ripple{fill:none;stroke:var(--sig);stroke-width:2;animation:ripple 1.4s steps(7) forwards;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(4);opacity:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);border-top:1px solid var(--line-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* ---------- activity log ---------- */
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:2px 11px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line-2);text-decoration:none;color:inherit}
.lg:last-child{border:0}
.lg .sigil{grid-row:1/3}
.lg .who{font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.lg .who b{color:var(--ink);font-weight:600}
.lg .t{font:500 10.5px var(--mono);color:var(--mut);align-self:center}
.lg .tx{grid-column:2/4;font-size:13.5px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.lg.peer .tx{border-left:3px solid var(--sig);padding-left:8px}
.lg.new{animation:flash 1.4s steps(5)}
@keyframes flash{from{background:color-mix(in srgb,var(--sig) 20%,transparent)}}
.pane .ph{display:flex;align-items:center;gap:10px;height:var(--strip);padding:0 16px;border-bottom:1px solid var(--edge);background:var(--bg);position:sticky;top:0;z-index:2}
.pane .pb{padding:6px 16px 20px}
.card .lg{padding:10px 0}

/* ---------- attention ---------- */
.ledger.att .rw>a{grid-template-columns:36px minmax(0,1fr) auto;padding-right:14px}
.att .go{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.att p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.att .nm b{white-space:normal}
.att.urgent{background:color-mix(in srgb,var(--sig) 9%,var(--panel));box-shadow:inset 3px 0 0 var(--sig)}

/* ---------- skeleton ---------- */
.sk{height:64px;border-top:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--dim) 0 1px,transparent 1px 7px);animation:blink 1.4s steps(2) infinite}
.sk.cell{height:104px;border:0}
.boot{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:18px 2px}
.boot::after{content:"▍";margin-left:4px;animation:blink 1s steps(1) infinite}

/* ---------- sheet & palette ---------- */
dialog{width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 40px);border:1px solid var(--edge);border-radius:var(--r);padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--hard)}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:in .14s steps(3)}

<script src="/auth.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const store = {get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }};
const ICON = {
  rooms: '<circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><circle cx="19" cy="9" r="1.6"/><circle cx="6" cy="16.5" r="1.6"/>',
  attention: '<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',
  plug: '<path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  shield: '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  hub: '<rect x="4" y="4" width="16" height="6"/><rect x="4" y="14" width="16" height="6"/><path d="M8 7h.01M8 17h.01"/>',
  add: '<path d="M12 5v14M5 12h14"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 13.8c2.8-.4 5 1.4 5 4.2"/>',
  shieldx: '<path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V6z"/><path d="M10 10l4 4M14 10l-4 4"/>',
};
const svgi = (n, cls = "") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${ICON[n]}</svg>`;

function toast(text, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = text;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 6500 : 3200);
}
const ago = ms => { if (!ms) return "never"; const s = Math.max(0, (Date.now() - ms) / 1000 | 0); return s < 60 ? "just now" : s < 3600 ? `${s / 60 | 0} min ago` : s < 86400 ? `${s / 3600 | 0} h ago` : `${s / 86400 | 0} d ago`; };
const deviceGuess = () => { const u = navigator.userAgent; const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows PC" : /Linux/.test(u) ? "Linux" : "Device"; const br = /Edg\//.test(u) ? "Edge" : /Firefox/.test(u) ? "Firefox" : /Chrome/.test(u) ? "Chrome" : /Safari/.test(u) ? "Safari" : ""; return (os + " " + br).trim(); };

/* every hub call goes through here: 401 sends you to the lock screen, sensitive actions ask for a passkey touch */
async function api(method, path, body) {
  const init = {method, headers: {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)};
  let r;
  try { r = await PB.guarded(path, init); }
  catch (e) {
    const t = String(e && (e.name + " " + e.message));
    throw new Error(/NotAllowed|cancel|abort/i.test(t) ? "The passkey touch was cancelled. Try again." : e instanceof TypeError ? "Couldn't reach the hub. Check your connection and try again." : (e && (e.message || e.name)) || "Something went wrong. Reload the page and try again.");
  }
  if (r.status === 401) { location.href = "/"; throw new Error("signed out"); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || (r.status === 502 || r.status === 504 || r.status === 524 ? "The hub took too long to answer (" + r.status + "). Try again in a moment." : "Something went wrong (" + r.status + "). Try again."));
  return j;
}

/* ---------- dot-matrix type: 5x7 cells, one bit per dot. Used for the wordmark and the big readouts ---------- */
const GLYPH = {P: [30, 17, 17, 30, 16, 16, 16], L: [16, 16, 16, 16, 16, 16, 31], A: [14, 17, 17, 31, 17, 17, 17], Y: [17, 17, 10, 4, 4, 4, 4], B: [30, 17, 17, 30, 17, 17, 30], O: [14, 17, 17, 17, 17, 17, 14], X: [17, 17, 10, 4, 10, 17, 17],
  0: [14, 17, 19, 21, 25, 17, 14], 1: [4, 12, 4, 4, 4, 4, 14], 2: [14, 17, 1, 2, 4, 8, 31], 3: [30, 1, 1, 14, 1, 1, 30], 4: [2, 6, 10, 18, 31, 2, 2], 5: [31, 16, 30, 1, 1, 17, 14], 6: [6, 8, 16, 30, 17, 17, 14], 7: [31, 1, 2, 4, 8, 8, 8], 8: [14, 17, 17, 14, 17, 17, 14], 9: [14, 17, 17, 15, 1, 2, 12]};
function dm(text, bare) {
  const px = 5, pitch = 7, adv = 6 * pitch;
  let on = "", off = "", x = 0;
  for (const ch of String(text)) {
    const g = GLYPH[ch] || [0, 0, 0, 0, 0, 0, 0];
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) {
      const sq = `M${x + c * pitch} ${r * pitch}h${px}v${px}h-${px}z`;
      if (g[r] >> (4 - c) & 1) on += sq; else if (!bare) off += sq;
    }
    x += adv;
  }
  return `<svg class="dm" viewBox="0 0 ${x - pitch - 2} ${7 * pitch - 2}" role="img" aria-label="${esc(String(text).trim())}" shape-rendering="crispEdges">${bare ? "" : `<path class="off" d="${off}"/>`}<path class="on" d="${on}"/></svg>`;
}
const pad = n => String(n).padStart(2, " ");

/* ---------- pixel identity: a 5x5 mirrored glyph derived from the room id, so a room is recognisable at a glance ---------- */
function sigil(id, size = 36) {
  let h = 2166136261; for (const c of String(id)) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  let bits = 0;
  for (let i = 0; i < 8; i++) {
    h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
    bits = h & 0x7fff; const n = bits.toString(2).replace(/0/g, "").length; if (n >= 6 && n <= 11) break;
  }
  let d = "";
  for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (bits >> (r * 3 + c) & 1) { d += `M${c + 1} ${r + 1}h1v1h-1z`; if (c < 2) d += `M${5 - c} ${r + 1}h1v1h-1z`; }
  return `<svg class="sigil" viewBox="0 0 7 7" width="${size}" height="${size}" aria-hidden="true" shape-rendering="crispEdges"><path d="${d}"/></svg>`;
}

/* ---------- state ---------- */
const S = {knocks: [], out: [], rooms: [], attention: [], activity: [], filter: "all", view: store.get("pb.view", "rooms"), mode: store.get("pb.mode", innerWidth >= 820 ? "orbit" : "list"), live: false, me: null, loaded: false};
const room = id => S.rooms.find(r => r.id === id);
const STATE_TXT = {live: "Active", idle: "Quiet", hold: "Witness hold", bad: "Chain failed", empty: "No room yet", down: "Unreachable"};

/* ---------- boot / auth ---------- */
async function boot() {
  navigator.serviceWorker?.register("/sw.js").catch(() => {});
  const q = new URLSearchParams(location.search);
  const hashCode = location.pathname === "/pair" ? decodeURIComponent(location.hash.slice(1)) : "";
  if (hashCode) history.replaceState(null, "", "/pair");           // keep the one-time code out of history and Referer
  if (location.pathname === "/join" && location.hash.length > 1) {    // an invite link: keep it across sign-in, out of history and Referer
    let f = decodeURIComponent(location.hash.slice(1)); if (f.startsWith("web+playbox:")) f = f.slice(12);

  try { st = await (await fetch("/api/auth/state")).json(); } catch { return paintOffline(); }

}
const wordmark = (tag) => `<div class="wordmark">${dm("PLAYBOX", true)}</div><div class="lbl tag" style="text-align:center">${tag}</div>`;
function paintOffline() { $("#root").innerHTML = `<div class="center"><div class="auth">${wordmark("No signal")}<p class="mut" style="text-align:center">The hub can't be reached. Is it running on your machine, and are you on the same network (or tailnet)?</p><button class="btn primary block" onclick="location.reload()">Try again</button></div></div>`; }

/* A passkey prompt is a system sheet the page can't see: say so while it is up, and put the button back if it fails. */
async function withPrompt(btn, errEl, text, fn) {
  const was = btn.textContent, hint = document.createElement("p");
  hint.className = "mut"; hint.style.cssText = "font-size:12.5px;margin:12px 0 0"; hint.textContent = "Your browser should be asking you to confirm with your fingerprint, face or PIN.";

  const slow = setTimeout(() => { hint.textContent = "Still waiting. If you can't see a prompt, look for another window or a security-key request, or cancel and try again."; }, 8000);
  try { await fn(); } catch (e) { errEl.textContent = e.message; btn.disabled = false; btn.textContent = was; } finally { clearTimeout(slow); hint.remove(); }
}
/* Passkeys are bound to a hostname, and a browser refuses them on an IP address. The hub prints 127.0.0.1, so people open it. */
const onLoopbackIp = () => ["127.0.0.1", "[::1]"].includes(location.hostname);
const localhostUrl = path => `${location.protocol}//localhost${location.port ? ":" + location.port : ""}${path}`;

function paintLock(st) {
  if (onLoopbackIp()) { $("#root").innerHTML = `<div class="center"><div class="auth">${wordmark("Open it by name")}<div class="card"><h2>Use localhost, not 127.0.0.1</h2><p class="mut" style="margin:0">Your browser only allows passkeys on a name, not an IP address. It's the same hub.</p><p style="margin:14px 0 0"><a class="btn primary block" style="text-decoration:none;text-align:center" href="${esc(localhostUrl("/"))}">Open ${esc(localhostUrl("/").replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a></p></div></div></div>`; return; }
  const strong = PB.canPasskey();
  $("#root").innerHTML = `<div class="center"><div class="auth">${wordmark("Private room hub")}
    ${strong ? `<button class="btn primary block" id="unlock">Unlock with passkey</button>` :
      `<div class="card"><h2>Passkeys need HTTPS</h2><p class="mut" style="margin:0">This address is plain HTTP, so your browser won't run passkeys here. Open the hub's HTTPS address (<span class="mono">--tailscale</span>), or paste a pairing code from the hub's terminal.</p>
      ${st.weak_ok ? `<label for="code">Pairing code</label><input id="code" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn block" id="weak" style="margin-top:14px">Continue on this network</button>` : ""}</div>`}
    <p class="err" id="err"></p>
    <p class="mut" style="font-size:12.5px;text-align:center">New device? Run <span class="mono">playbox_hub.py --pair</span> on the hub machine, or use Devices inside the app on a device you've already paired.</p></div></div>`;
  const go = () => withPrompt($("#unlock"), $("#err"), "Waiting for your passkey…", async () => { await PB.login(); location.href = "/"; });

  $("#weak")?.addEventListener("click", async () => { try { await PB.weak($("#code").value.trim(), deviceGuess()); location.href = "/"; } catch (e) { $("#err").textContent = e.message; } });

function paintPair(st, code) {

/* ---------- app ---------- */
async function startApp(view, inviteRoom) {

  let pend = null; try { pend = sessionStorage.getItem("pb.invite"); sessionStorage.removeItem("pb.invite"); } catch {}

  else if (pend) { try { const [l, n] = pend.split("~"); const un = x => decodeURIComponent(escape(atob(x.replace(/-/g, "+").replace(/_/g, "/")))); openAdd({link: un(l), label: n ? un(n) : ""}); } catch { toast("That invite link is damaged", true); } }

}
async function loadKnocks() { try { S.knocks = (await api("GET", "/api/knocks")).requests; } catch {} if ($("#view") && (S.view === "rooms" || S.view === "attention")) paintView(true); }

  let prev = S.out;

  for (const r of S.out) { const was = prev.find(x => x.rid === r.rid);
    if (r.state === "joined" && was && was.state === "waiting") { toast(`You're in "${r.label}"`); refreshRooms(); api("DELETE", `/api/knock/out/${r.rid}`).catch(() => {}); }
    if (r.state === "denied" && was && was.state === "waiting") toast(`Not this time: "${r.label}" wasn't approved`, true); }
  S.out = S.out.filter(r => !(r.state === "joined"));
  clearTimeout(loadOut.t); if (S.out.some(r => r.state === "waiting" || (r.agent && r.state === "approved"))) loadOut.t = setTimeout(loadOut, 3000);

}
async function refreshRooms() {

  catch (e) { if (e.message === "signed out") return; S.stale = true; }

}

let es;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events");
  // Some paths (Cloudflare quick tunnels) open the stream but never deliver events. No hello in 6 s: poll instead.
  clearTimeout(connect.t); S.helloed = false;
  connect.t = setTimeout(() => { if (!S.helloed) { es.close(); S.poll = true; S.live = true; paintStatus(); startPolling(); } }, 6000);
  es.onopen = () => { if (!S.poll) { S.live = true; paintStatus(); } };
  es.onerror = () => { if (!S.poll) { S.live = false; paintStatus(); } };
  es.addEventListener("hello", e => { S.helloed = true; S.poll = false; clearInterval(startPolling.i); const d = JSON.parse(e.data); S.rooms = d.rooms; S.attention = d.attention; S.activity = d.activity || []; S.loaded = true; S.stale = false; mood(); paintView(); });
  es.addEventListener("room", e => {
    const d = JSON.parse(e.data), i = S.rooms.findIndex(r => r.id === d.id), old = S.rooms[i];
    if (i < 0) S.rooms.push(d); else S.rooms[i] = d;
    if (old && d.last && (!old.last || old.last.ms !== d.last.ms)) ripple(d.id);
    mood(); paintView(true);
  });
  es.addEventListener("activity", e => {
    const a = JSON.parse(e.data);
    if (S.activity.some(x => x.room === a.room && x.ms === a.ms && x.text === a.text)) return;
    a.fresh = true; S.activity.unshift(a); S.activity = S.activity.slice(0, 40);
    paintActivity();
  });
  es.addEventListener("sec", e => {
    const ev = JSON.parse(e.data);
    if (S.sys) {
      const old = S.sys.events.find(x => x.n === ev.n);
      if (old) Object.assign(old, ev); else S.sys.events.unshift(ev);
      S.sys.events = S.sys.events.slice(0, 80);
      const l = S.sys.live[ev.stage]; if (l) { l.count++; l.last = ev.ms; l.level = ev.level; }
      S.sysNew = (S.sysNew || new Set()).add(ev.n); S.pulse = {stage: ev.stage};
      if (S.view === "system") paintView(true);
    }
    if (S.view === "system") scheduleSystem();
  });
  es.addEventListener("gone", e => { S.rooms = S.rooms.filter(r => r.id !== JSON.parse(e.data).id); paintView(); });
  es.addEventListener("attention", e => {
    const prev = new Set(S.attention.map(a => a.id));
    S.attention = JSON.parse(e.data).items;
    for (const a of S.attention) if (!prev.has(a.id) && a.urgent) { toast(a.title); localNotify(a); }
    mood(); paintChrome(); loadKnocks(); if (S.view === "rooms" || S.view === "attention") paintView(true);
  });
  es.addEventListener("bye", () => { location.href = "/"; });
}
function startPolling() {
  clearInterval(startPolling.i);
  startPolling.i = setInterval(() => { if (!document.hidden && S.poll) refreshRooms(); }, 10000);
}
function localNotify(a) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  swReady().then(reg => reg.showNotification(a.title, {tag: "pb-" + a.id, body: a.body || "", icon: "/icon-192.png", data: {url: `/r/${a.room}/`}})).catch(() => {});
}
function mood() {
  const m = S.attention.some(a => a.urgent) ? "alert" : S.rooms.some(r => r.state === "live") ? "live" : "calm";
  document.documentElement.dataset.mood = m;

function go(view) { if (view === "add") return openAdd(); S.view = view; enter = true; store.set("pb.view", view); history.replaceState(null, "", view === "rooms" ? "/" : `/?view=${view}`); paintView(); scrollTo(0, 0); }

/* numbers tick to their new value like a mechanical counter instead of snapping */
const prevNums = {};
function countUp() {
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, k = el.dataset.key, from = prevNums[k] ?? 0;
    prevNums[k] = to;
    if (from === to || matchMedia("(prefers-reduced-motion:reduce)").matches) { el.innerHTML = dm(pad(to)); return; }
    const t0 = performance.now(), dur = 520;
    const step = t => { const p = Math.min(1, (t - t0) / dur); el.innerHTML = dm(pad(Math.round(from + (to - from) * p))); if (p < 1 && el.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const rel = ms => { const s = Math.max(0, (Date.now() - ms) / 1000 | 0); return s < 45 ? "now" : s < 3600 ? `${Math.max(1, s / 60 | 0)}m` : s < 86400 ? `${s / 3600 | 0}h` : `${s / 86400 | 0}d`; };
function tickAgo() { document.querySelectorAll("[data-ms]").forEach(el => { el.textContent = rel(+el.dataset.ms); }); }

/* ---------- pieces ---------- */
function chainChip(r) {

    : `<span class="chip bad shield" title="Signed history does not verify">${svgi("shieldx")}broken</span>`;
}
/* segmented level meter: the last two hours in 24 columns of up to four lit segments */
const METER_COL = {live: "var(--ok-led)", hold: "var(--sig)", bad: "var(--bad)", idle: "var(--ink-2)"};
function meter(pulse, state) {
  const p = pulse && pulse.length ? pulse : Array(24).fill(0), max = Math.max(3, ...p);
  let on = "", off = "";
  p.forEach((v, i) => { const lv = v ? Math.max(1, Math.ceil(v / max * 4)) : 0; for (let s = 0; s < 4; s++) { const sq = `M${i * 4} ${12 - s * 4}h3v3h-3z`; if (s < lv) on += sq; else off += sq; } });
  return `<svg class="meter" viewBox="0 0 ${p.length * 4 - 1} 15" shape-rendering="crispEdges" role="img" aria-label="Messages over the last two hours"><path class="off" d="${off}"/><path d="${on}" fill="${METER_COL[state] || "var(--mut)"}"/></svg>`;
}

/* ---------- radar ---------- */
const orbit = {angles: {}, raf: 0, last: 0};

function constellation(list) {

    const rs = list.filter(r => r.kind === k);
    rs.forEach((r, i) => { if (orbit.angles[r.id] === undefined) orbit.angles[r.id] = (i / rs.length) * 6.2832 + (k === "shared" ? .6 : 0); });

  const nodes = list.map(r => {
    const h = 18 + Math.min(r.members, 8), label = (r.label.length > 18 ? r.label.slice(0, 17) + "…" : r.label).toUpperCase();
    return `<a href="/r/${r.id}/" aria-label="${esc(r.label)}: ${STATE_TXT[r.state] || ""}${r.unread ? `, ${r.unread} unread` : ""}"><g class="node ${r.state}" data-node="${r.id}" transform="translate(${CX} ${CY})">
      <title>${esc(r.label)} · ${esc(STATE_TXT[r.state] || "")}${r.machine ? " · " + esc(r.machine) : ""}</title>
      <g class="ripples"></g><rect class="halo" x="${-h}" y="${-h}" width="${h * 2}" height="${h * 2}"/><rect class="frame" x="${-h}" y="${-h}" width="${h * 2}" height="${h * 2}"/>
      <g transform="translate(${-h + 3} ${-h + 3})">${sigil(r.id, h * 2 - 6)}</g>
      <text y="${h + 16}">${esc(label)}</text>${r.machine ? `<text class="sub" y="${h + 28}">${esc(r.machine.toUpperCase())}</text>` : ""}
      ${r.unread ? `<rect class="nb" x="${h - 8}" y="${-h - 8}" width="17" height="15"/><text class="nbt" x="${h + .5}" y="${-h + 3}">${r.unread > 9 ? "9+" : r.unread}</text>` : ""}</g></a>`;
  }).join("");
  const edges = list.map(r => `<line class="edge" data-edge="${r.id}" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY}"/>`).join("");
  return `<svg class="const" viewBox="${CX - 300} ${CY - 285} 600 575" role="group" aria-label="Your rooms as a radar">
    <line class="cross" x1="${CX - 290}" y1="${CY}" x2="${CX + 290}" y2="${CY}"/><line class="cross" x1="${CX}" y1="${CY - 280}" x2="${CX}" y2="${CY + 280}"/>
    <ellipse class="orbit" cx="${CX}" cy="${CY}" rx="${RING.mine}" ry="${RING.mine * .92}"/><ellipse class="orbit" cx="${CX}" cy="${CY}" rx="${RING.shared}" ry="${RING.shared * .92}"/>${ticks}
    <text class="olabel" x="${CX + 6}" y="${CY - RING.mine * .92 - 6}">MINE</text><text class="olabel" x="${CX + 6}" y="${CY - RING.shared * .92 - 6}">SHARED</text>
    ${edges}<g class="node me"><rect class="frame" x="${CX - 13}" y="${CY - 13}" width="26" height="26"/><rect x="${CX - 4}" y="${CY - 4}" width="8" height="8" fill="var(--sig)"/><text x="${CX}" y="${CY + 32}">THIS HUB</text></g>${nodes}</svg>`;

function placeNodes() {

  const r = room(id); if (!r) return;
  sheet().innerHTML = `<form method="dialog" id="editform"><h2>${esc(r.label)}</h2>
    ${r.mode === "host" || r.mode === "both" ? `<p style="margin:14px 0 0"><button class="btn primary block" data-act="invite" data-id="${r.id}" value="cancel" formnovalidate>Invite a friend</button></p>` : ""}
    <label for="elabel">Name</label><input id="elabel" value="${esc(r.label)}" maxlength="60">
    <label for="emachine">Where it runs</label><input id="emachine" value="${esc(r.machine)}" maxlength="40">
    <label>Who is in it?</label><div class="radio"><label><input type="radio" name="ekind" value="mine" ${r.kind === "mine" ? "checked" : ""}>My agents</label><label><input type="radio" name="ekind" value="shared" ${r.kind === "shared" ? "checked" : ""}>Shared</label></div>
    <p class="err" id="eerr"></p>
    <div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn danger" id="edel" value="cancel" formnovalidate>Remove…</button><span class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="x">Save</button></span></div></form>`;
  $("#editform").addEventListener("submit", async e => {
    if (e.submitter?.value === "cancel") return;
    e.preventDefault();
    try { await api("PATCH", `/api/rooms/${id}`, {label: $("#elabel").value.trim(), machine: $("#emachine").value.trim(), kind: document.querySelector("[name=ekind]:checked").value}); sheet().close(); } catch (err) { $("#eerr").textContent = err.message; }
  });
  $("#edel").addEventListener("click", async e => {
    e.preventDefault();
    if (!confirm(`Remove "${r.label}" from this hub? The room itself isn't deleted; this hub just stops watching it.`)) return;
    try { await api("DELETE", `/api/rooms/${id}`); sheet().close(); toast("Removed"); } catch (err) { $("#eerr").textContent = err.message; }
  });
  sheet().showModal();
}
async function pairDevice() {
  try {
    const r = await api("POST", "/api/devices/pair");
    const url = `${location.origin}/pair#${r.code}`;
    sheet().innerHTML = `<form method="dialog"><h2>Add a device</h2><p class="mut" style="margin-top:14px">Open this link on the new device within 10 minutes. It works once.</p>
      <div class="card mono" style="word-break:break-all;user-select:all">${esc(url)}</div>
      <p class="mut" style="font-size:13px">${location.protocol === "https:" ? "" : "This address is plain HTTP, so the new device can only pair without a passkey. Open the hub's HTTPS address for passkeys."}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="cp" value="x">Copy</button>${navigator.share ? '<button class="btn" id="sh" value="x">Share</button>' : ""}<button class="btn primary" value="cancel">Done</button></div></form>`;
    $("#cp").addEventListener("click", async e => { e.preventDefault(); try { await navigator.clipboard.writeText(url); toast("Copied"); } catch { toast("Copy failed", true); } });
    $("#sh")?.addEventListener("click", e => { e.preventDefault(); navigator.share({url}).catch(() => {}); });
    sheet().showModal();
  } catch (e) { toast(e.message, true); }
}

/* ---------- push + install ---------- */
const swReady = (ms = 2500) => Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error("The service worker isn't running in this browser.")), ms))]);
async function pushState() {
  const b = $("#pushbtn"); if (!b) return;
  if (!("serviceWorker" in navigator && "PushManager" in window && "Notification" in window)) { b.textContent = "Not supported here"; b.disabled = true; return; }
  if (!window.isSecureContext) { b.textContent = "Needs HTTPS"; b.disabled = true; return; }
  let reg; try { reg = await swReady(); } catch { b.textContent = "Unavailable in this browser"; b.disabled = true; return; }
  const sub = await reg.pushManager.getSubscription();
  b.textContent = Notification.permission === "denied" ? "Blocked in browser settings" : sub ? "Turn off notifications" : "Turn on notifications";
  b.disabled = Notification.permission === "denied"; b.dataset.on = sub ? "1" : "";
}
async function togglePush() {
  let reg, sub;
  try { reg = await swReady(); sub = await reg.pushManager.getSubscription(); } catch (e) { return toast(e.message, true); }
  try {
    if (sub) { await api("POST", "/api/push/unsubscribe", {endpoint: sub.endpoint}); await sub.unsubscribe(); toast("Notifications off"); }
    else {
      if (await Notification.requestPermission() !== "granted") return toast("Permission not granted", true);
      const s = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: PB.unb64u(S.me.push_key)});
      await api("POST", "/api/push/subscribe", {endpoint: s.endpoint}); toast("Notifications on");
    }
  } catch (e) { toast(e.message, true); }
  pushState();
}
let installEvt;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = $("#installbtn"); if (b) { b.hidden = false; $("#installhint").hidden = true; } });
addEventListener("appinstalled", () => toast("Installed"));

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-mode],[data-act],[data-filter],[data-theme]"); if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.filter) { S.filter = t.dataset.filter; return paintView(); }
  if (t.dataset.theme) { const v = t.dataset.theme; if (v === "auto") { delete document.documentElement.dataset.theme; store.set("pb.theme", "auto"); } else { document.documentElement.dataset.theme = v; store.set("pb.theme", v); } syncThemeColor(); return paintView(); }
  if (t.dataset.mode) { S.mode = t.dataset.mode; store.set("pb.mode", S.mode); return paintView(); }
  const act = t.dataset.act;
  if (act !== "edit" && t.closest("a")) return;
  e.preventDefault();
  if (act === "add") openAdd();
  else if (act === "palette") openPalette();
  else if (act === "theme") toggleTheme();
  else if (act === "edit") openEdit(t.dataset.id);
  else if (act === "agent") connectAgent(t.dataset.id, t);
  else if (act === "kapprove") { t.disabled = true; try { await api("POST", `/api/knocks/${t.dataset.id}/approve`, {}); toast("Approved. They're being let in."); } catch (er) { toast(er.message, true); t.disabled = false; } loadKnocks(); }
  else if (act === "kdeny") { try { await api("POST", `/api/knocks/${t.dataset.id}/deny`, {}); toast("Denied"); } catch (er) { toast(er.message, true); } loadKnocks(); }
  else if (act === "kcancel") { const was = S.out.find(x => x.rid === t.dataset.id); try { await api("DELETE", `/api/knock/out/${t.dataset.id}`); } catch {}
    if (was && was.agent && was.state === "approved") { try { sessionStorage.removeItem("pb.knockctx"); sessionStorage.removeItem("pb.agentlink"); } catch {} }
    await loadOut(); refreshRooms(); }
  else if (act === "kcopy") { try { const r = S.out.find(x => x.rid === t.dataset.id); await navigator.clipboard.writeText(`Join this Playbox room with playbox_join, using this link: ${r.link}`); toast("Copied"); } catch { toast("Copy failed", true); } }
  else if (act === "kagent") { try { const ctx = JSON.parse(sessionStorage.getItem("pb.knockctx")); await api("POST", "/api/knock", {base: ctx.b, id: ctx.i, k: ctx.k, label: ctx.r, name: (store.get("pb.name", "") || "Me") + "'s agent", agent_guest: $("#agid").value.trim()}); loadOut(); } catch (er) { toast(er.message, true); } }
  else if (act === "gointeg") go("integrations");
  else if (act === "savekey") { const k = $("#ckey").value; integCall("POST", "/api/integrations/key", {key: k}, () => { S.tk = null; toast("Saved"); searchApps(""); }); }
  else if (act === "clearkey") { if (confirm("Remove the Composio key from this hub? Connected apps stop working until you add it again.")) integCall("DELETE", "/api/integrations/key", null, () => { S.tk = null; }); }
  else if (act === "tkgo") searchApps($("#tkq").value);
  else if (act === "connectapp") integCall("POST", "/api/integrations/connect", {toolkit: t.dataset.id}, j => { window.open(j.url, "_blank", "noopener"); toast("Finish signing in in the new tab, then come back and reload."); });
  else if (act === "unlink") { if (confirm("Disconnect this app? Every room loses access to it.")) integCall("DELETE", `/api/integrations/accounts/${encodeURIComponent(t.dataset.id)}`); }
  else if (act === "grant") { const id = t.dataset.id; integCall("POST", `/api/rooms/${$(`[data-grant-room="${id}"]`).value}/grants`, {account: id, level: $(`[data-grant-level="${id}"]`).value}); }
  else if (act === "mktok") integCall("POST", `/api/rooms/${$("#tokroom").value}/agent-tokens`, {label: $("#toklabel").value}, j => {
    const base = location.origin;
    S.newTok = {token: j.token, prompt: `Playbox integrations for this room. Hub: ${base}\nKey: ${j.token}\nSend the key as "Authorization: Bearer <key>".\nGET  ${base}/x/grants  (apps and levels this room has)\nGET  ${base}/x/tools?toolkit=<app>  (tools and whether each is allowed)\nPOST ${base}/x/execute  {"toolkit":"<app>","tool":"<TOOL_SLUG>","arguments":{}}\nDon't print or store the key anywhere else.`};
  });
  else if (act === "copytok") { try { await navigator.clipboard.writeText(S.newTok.prompt); toast("Copied"); } catch { toast("Copy failed", true); } }
  else if (act === "donetok") { S.newTok = null; paintView(true); }
  else if (act === "rmtok") { if (confirm("Revoke this key? The agent using it stops working.")) integCall("DELETE", `/api/agent-tokens/${encodeURIComponent(t.dataset.id)}`); }
  else if (act === "ungrant") integCall("DELETE", `/api/grants/${encodeURIComponent(t.dataset.id)}`);
  else if (act === "othermcp") { S.showManual = !S.showManual; paintSetup(); }
  else if (act === "copymcp") { try { await navigator.clipboard.writeText(S.manual.json); toast("Copied"); } catch { toast("Copy failed", true); } }
  else if (act === "hidesetup") { store.set("pb.setup.hide", "1"); try { sessionStorage.removeItem("pb.knockctx"); sessionStorage.removeItem("pb.agentlink"); } catch {} paintSetup(); }
  else if (act === "copyagent") { try { const h = JSON.parse(sessionStorage.getItem("pb.agentlink")); await navigator.clipboard.writeText(`Join this Playbox room with playbox_join, using this link: ${h.link}`); toast("Copied"); } catch { toast("Copy failed", true); } }
  else if (act === "invite") { sheet().close(); openInvite(t.dataset.id); }
  else if (act === "sysnode") { S.sysStage = S.sysStage === t.dataset.id ? null : t.dataset.id; paintView(true); }
  else if (act === "sysverify") { t.disabled = true; t.textContent = "Verifying…"; try { S.sys = await api("POST", "/api/system/verify"); S.sysAt = Date.now(); toast("History re-verified"); } catch (er) { toast(er.message, true); } paintView(true); }
  else if (act === "rminv") { try { await api("DELETE", `/api/invites/${t.dataset.id}`); loadInvites(); } catch (er) { toast(er.message, true); } }
  else if (act === "pairdev") pairDevice();
  else if (act === "push") togglePush();
  else if (act === "install") { installEvt?.prompt(); installEvt = null; t.hidden = true; }
  else if (act === "logout") { await fetch("/api/auth/logout", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}); try { await caches.delete("pb-data"); } catch {} location.href = "/"; }
  else if (act === "rmdev") { if (confirm("Remove this device? It will be signed out and its passkey stops working here.")) try { await api("DELETE", `/api/devices/${encodeURIComponent(t.dataset.id)}`); S.me = await api("GET", "/api/me"); paintView(); } catch (er) { toast(er.message, true); } }
  else if (act === "rmses") { try { await api("DELETE", `/api/sessions/${t.dataset.id}`); S.me = await api("GET", "/api/me"); paintView(); } catch (er) { toast(er.message, true); } }
});
sheet().addEventListener("click", e => { if (e.target === sheet()) sheet().close(); });
boot();
</script>
</body>
</html>
