<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12122a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Playbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Playbox</title>
<style>
:root{
  --bg:#12122a; --bg-2:#1d1d3c; --ink:#f2f2f6; --mut:#a3a3bf; --line:rgba(255,255,255,.1);
  --card:rgba(255,255,255,.055); --card-2:rgba(255,255,255,.1);
  --gold:#e8c872; --ok:#7fd6b0; --bad:#ff9090; --link:#aab4ff;
  --aura:rgba(120,120,255,.2); --r:14px; --nav-h:62px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",ui-sans-serif,sans-serif;
}
html[data-mood=live]{--aura:rgba(127,214,176,.17)}
html[data-mood=alert]{--aura:rgba(232,200,114,.24)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  background-image:radial-gradient(1000px 560px at 50% -140px,var(--aura),transparent 70%);background-attachment:fixed;transition:background-image .8s}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
h2{font-size:13px;color:var(--mut)}
a{color:var(--link)}
.mut{color:var(--mut)} .mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* shell */
.shell{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 62%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.22em;font-size:17px;font-weight:600}
.brand img{width:28px;height:28px;border-radius:8px}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(127,214,176,.2)}
.dot.warn{background:var(--gold)}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:6px 16px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom))}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:99px;cursor:pointer;color:var(--mut);font-size:13px}
.seg button[aria-pressed=true]{background:var(--card-2);color:var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(18,18,42,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;background:none;border:0;border-radius:10px;cursor:pointer;
  color:var(--mut);font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--ink)} .tab[aria-current=page] svg{stroke:var(--gold)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#1a1a2e;font:600 10px/16px var(--sans);padding:0 4px;text-align:center}
@media(min-width:820px){
  .tabs{position:static;border:0;background:none;backdrop-filter:none;display:flex;gap:4px;padding:0;margin-left:18px}
  .tab{flex-direction:row;gap:8px;padding:8px 14px;min-height:40px;font-size:13px}
  .tab[aria-current=page]{background:var(--card-2)}
  .badge{position:static;margin-left:2px}
  main{padding-bottom:48px}
}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--gold);color:#1a1a2e;border-color:transparent;font-weight:600}
.btn.danger{color:var(--bad)} .btn.sm{min-height:36px;padding:0 13px;font-size:13.5px} .btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,textarea,select{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
textarea{min-height:84px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--card-2);color:var(--mut);letter-spacing:.02em}
.chip.mine{color:var(--ok)} .chip.shared{color:var(--link)} .chip.warn{color:var(--gold)} .chip.bad{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)} .stat:last-child{border:0}
.empty{text-align:center;color:var(--mut);padding:40px 16px}

/* room cards */
.room{display:grid;align-content:start;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;position:relative;text-decoration:none;color:inherit;transition:transform .15s,border-color .2s}
.room:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.room h3{font-size:16px;letter-spacing:.06em;margin:0;text-transform:none;font-family:var(--sans);font-weight:600}
.room .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.g-sig{grid-column:1;grid-row:1}.g-info{grid-column:2;grid-row:1;min-width:0}.g-kebab{grid-column:3;grid-row:1;align-self:start}
.g-status{grid-column:1/-1;grid-row:2;display:flex;justify-content:space-between;align-items:center}
.room .last{grid-column:1/-1;grid-row:3;font-size:13.5px;color:var(--mut);border-left:2px solid rgba(232,200,114,.55);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .last b{color:var(--ink);font-weight:500}
.room.hold{border-color:rgba(232,200,114,.7);box-shadow:0 0 0 1px rgba(232,200,114,.25),0 8px 30px -10px rgba(232,200,114,.4)}
.room.bad{border-color:rgba(255,144,144,.6)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.state.live i{background:var(--ok);animation:beat 1.8s infinite} .state.hold i{background:var(--gold);animation:beat .9s infinite}
.state.bad i{background:var(--bad)} .state.idle i{background:var(--link);opacity:.7}
@keyframes beat{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.state.live{color:var(--ok)} .state.hold{color:var(--gold)} .state.bad{color:var(--bad)}
.unread{background:var(--gold);color:#1a1a2e;font:600 11px/18px var(--sans);min-width:20px;height:20px;border-radius:10px;text-align:center;padding:0 6px}
.kebab{background:none;border:0;color:var(--mut);cursor:pointer;width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1}
.kebab:hover{background:var(--card-2);color:var(--ink)}
.sigil{border-radius:12px;display:block}
.shield{display:inline-flex;align-items:center;gap:4px}
.shield svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* constellation */
.const-wrap{position:relative;border-radius:22px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(60% 60% at 50% 50%,rgba(130,130,255,.1),transparent 75%),rgba(255,255,255,.02)}
.const{display:block;width:100%;height:auto;max-height:78vh;touch-action:manipulation}
.const .orbit{fill:none;stroke:rgba(255,255,255,.17);stroke-dasharray:2 7}
.const .olabel{fill:var(--mut);font:10px var(--cond);letter-spacing:.25em;text-transform:uppercase}
.const .edge{stroke:rgba(255,255,255,.13);stroke-width:1}
.const a{cursor:pointer;outline:none}
.node .body{fill:rgba(30,30,64,.92);stroke-width:2.2;transition:stroke .4s}
.node .halo{fill:none;stroke-width:1.5;opacity:.0}
.node.live .body{stroke:var(--ok)} .node.live .halo{stroke:var(--ok);opacity:.9;animation:halo 2.4s infinite}
.node.hold .body{stroke:var(--gold);stroke-width:3} .node.hold .halo{stroke:var(--gold);opacity:1;animation:halo 1s infinite}
.node.bad .body{stroke:var(--bad)} .node.idle .body{stroke:rgba(170,180,255,.6)}
.node.empty .body,.node.down .body{stroke:rgba(255,255,255,.3);stroke-dasharray:3 4}
.node:hover .body,.node:focus-visible .body{stroke-width:4}
.node text{fill:var(--ink);font:12px var(--sans);text-anchor:middle;paint-order:stroke;stroke:#12122a;stroke-width:3px}
.node .sub{fill:var(--mut);font-size:10px}
.node .nb{fill:var(--gold)} .node .nbt{fill:#1a1a2e;stroke:none;font:600 10px var(--sans)}
.mdots{animation:spin 16s linear infinite} .mdots circle{fill:var(--link)}
.me .body{fill:rgba(232,200,114,.18);stroke:var(--gold);stroke-width:2}
.ripple{fill:none;stroke:var(--gold);stroke-width:2;animation:ripple 1.6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.node .halo{transform-box:fill-box;transform-origin:center}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* attention */
.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit}
.att .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--card-2)}
.att.urgent{border-color:rgba(232,200,114,.6)} .att.urgent .ico{background:rgba(232,200,114,.2);color:var(--gold)}
.att p{margin:0;color:var(--mut);font-size:13.5px}

/* sheet */
dialog{width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:20px;padding:0;background:var(--bg-2);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,5,18,.7);backdrop-filter:blur(4px)}
dialog form{padding:20px}
dialog h2{color:var(--ink);font-size:15px;margin-bottom:8px}
.radio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio label{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);font-size:14px}
.radio input{display:none} .radio label:has(input:checked){border-color:var(--gold);background:rgba(232,200,114,.1)}
.radio small{display:block;color:var(--mut);font-size:12px}

/* auth screens */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{max-width:420px;width:100%;text-align:center}
.auth img{width:84px;height:84px;border-radius:22px;margin-bottom:10px}
.auth h1{font-size:22px;letter-spacing:.24em;margin-bottom:6px}
.auth .card{text-align:left;margin-top:22px}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:8px 0 0}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));display:grid;gap:8px;justify-items:center;z-index:60;pointer-events:none}
.toast{background:#2b2b55;border:1px solid var(--line);padding:10px 16px;border-radius:12px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s}
.toast.err{border-color:var(--bad)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.offline{background:rgba(232,200,114,.15);border:1px solid rgba(232,200,114,.4);color:var(--gold);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="sheet"></dialog>
<script src="/auth.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const store = {get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }};
const ICON = {
  rooms: '<circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><circle cx="19" cy="9" r="1.6"/><circle cx="6" cy="16.5" r="1.6"/>',
  attention: '<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',
  hub: '<rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/>',
  add: '<path d="M12 5v14M5 12h14"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  shieldx: '<path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V6z"/><path d="M10 10l4 4M14 10l-4 4"/>',
};
const svgi = (n, cls = "") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${ICON[n]}</svg>`;

function toast(text, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = text;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 6500 : 3200);
}
const ago = ms => { if (!ms) return "never"; const s = Math.max(0, (Date.now() - ms) / 1000 | 0); return s < 60 ? "just now" : s < 3600 ? `${s / 60 | 0} min ago` : s < 86400 ? `${s / 3600 | 0} h ago` : `${s / 86400 | 0} d ago`; };
const deviceGuess = () => { const u = navigator.userAgent; const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows PC" : /Linux/.test(u) ? "Linux" : "Device"; const br = /Edg\//.test(u) ? "Edge" : /Firefox/.test(u) ? "Firefox" : /Chrome/.test(u) ? "Chrome" : /Safari/.test(u) ? "Safari" : ""; return (os + " " + br).trim(); };

/* every hub call goes through here: 401 sends you to the lock screen, sensitive actions ask for a passkey touch */
async function api(method, path, body) {
  const init = {method, headers: {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)};
  const r = await PB.guarded(path, init);
  if (r.status === 401) { location.href = "/"; throw new Error("signed out"); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------- deterministic sigil: identity you can recognise at a glance, derived from the room id ---------- */
function sigil(id, size = 46) {
  let h = 7; for (const c of id) h = (Math.imul(h, 31) + c.charCodeAt(0)) >>> 0;
  const rnd = () => { h = Math.imul(h ^ h >>> 15, 2246822519) >>> 0; h = Math.imul(h ^ h >>> 13, 3266489917) >>> 0; h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const hue = rnd() * 360 | 0, n = 3 + (rnd() * 5 | 0), m = 3 + (rnd() * 5 | 0), rot = rnd() * 6.28, dash = 2 + (rnd() * 6 | 0);
  const poly = (k, r, o) => Array.from({length: k}, (_, i) => { const a = i / k * 6.2832 + o; return `${(20 + r * Math.cos(a)).toFixed(1)},${(20 + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  return `<svg class="sigil" viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><rect width="40" height="40" fill="hsl(${hue} 45% 16%)"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="hsl(${(hue + 40) % 360} 60% 55%)" stroke-width="1" stroke-dasharray="${dash} 3" opacity=".7"/>
    <polygon points="${poly(n, 13, rot)}" fill="none" stroke="hsl(${hue} 85% 72%)" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="${poly(m, 7.5, -rot)}" fill="hsl(${(hue + 40) % 360} 80% 62% / .35)" stroke="hsl(${(hue + 40) % 360} 85% 75%)" stroke-width="1"/>
    <circle cx="20" cy="20" r="1.8" fill="#e8c872"/></svg>`;
}

/* ---------- state ---------- */
const S = {rooms: [], attention: [], view: store.get("pb.view", "rooms"), mode: store.get("pb.mode", innerWidth >= 820 ? "orbit" : "list"), live: false, me: null, loaded: false};
const room = id => S.rooms.find(r => r.id === id);
const STATE_TXT = {live: "Active now", idle: "Quiet", hold: "Witness hold", bad: "History check failed", empty: "Not in a room yet", down: "Unreachable"};

/* ---------- boot / auth ---------- */
async function boot() {
  navigator.serviceWorker?.register("/sw.js").catch(() => {});
  const q = new URLSearchParams(location.search);
  const hashCode = location.pathname === "/pair" ? decodeURIComponent(location.hash.slice(1)) : "";
  if (hashCode) history.replaceState(null, "", "/pair");           // keep the one-time code out of history and Referer
  let st;
  try { st = await (await fetch("/api/auth/state")).json(); } catch { return paintOffline(); }
  if (st.authed) { if (location.pathname === "/pair") history.replaceState(null, "", "/"); return startApp(q.get("view")); }
  if (hashCode || !st.enrolled) return paintPair(st, hashCode);
  paintLock(st);
}
function paintOffline() { $("#root").innerHTML = `<div class="center"><div class="auth"><img src="/icon-192.png" alt=""><h1>Playbox</h1><p class="mut">The hub can't be reached. Is it running on your machine, and are you on the same network (or tailnet)?</p><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`; }

function paintLock(st) {
  const strong = PB.canPasskey();
  $("#root").innerHTML = `<div class="center"><div class="auth"><img src="/icon-192.png" alt=""><h1>Playbox</h1>
    <p class="mut">Your rooms, one place.</p>
    ${strong ? `<button class="btn primary block" id="unlock">Unlock with passkey</button>` :
      `<div class="card"><h2>Passkeys need HTTPS</h2><p class="mut" style="margin:6px 0 0">This address is plain HTTP, so your browser won't run passkeys here. Open the hub's HTTPS address (<span class="mono">--tailscale</span>), or paste a pairing code from the hub's terminal.</p>
      ${st.weak_ok ? `<label for="code">Pairing code</label><input id="code" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn block" id="weak" style="margin-top:12px">Continue on this network</button>` : ""}</div>`}
    <p class="err" id="err"></p>
    <p class="mut" style="font-size:12.5px">New device? Run <span class="mono">playbox_hub.py --pair</span> on the hub machine, or use Devices inside the app on a device you've already paired.</p></div></div>`;
  const go = async () => { $("#err").textContent = ""; try { await PB.login(); location.href = "/"; } catch (e) { $("#err").textContent = e.message; } };
  $("#unlock")?.addEventListener("click", go);
  $("#weak")?.addEventListener("click", async () => { try { await PB.weak($("#code").value.trim(), deviceGuess()); location.href = "/"; } catch (e) { $("#err").textContent = e.message; } });
  if (strong && !matchMedia("(prefers-reduced-motion:reduce)").matches) setTimeout(go, 250);
}

function paintPair(st, code) {
  const strong = PB.canPasskey();
  $("#root").innerHTML = `<div class="center"><div class="auth"><img src="/icon-192.png" alt=""><h1>Pair this device</h1>
    ${!code && !st.enrolled ? `<p class="mut">This hub has no devices yet. Start it in a terminal and open the pairing link it prints.</p>` : `
    <div class="card"><label for="dn" style="margin-top:0">Name this device</label><input id="dn" value="${esc(deviceGuess())}" maxlength="40">

        st.weak_ok ? `<p class="mut" style="font-size:13px">This address is plain HTTP, so passkeys aren't available. Because you're on a private network you can pair without one. Sessions like this can't add or remove devices. For the full thing, use the hub's HTTPS address.</p>

        `<p class="mut">Passkeys need HTTPS and this address is plain HTTP. Open the hub's HTTPS address instead (start it with <span class="mono">--tailscale</span>).</p>`}

  const val = () => (code || $("#code")?.value || "").trim();
  $("#go")?.addEventListener("click", async () => { $("#err").textContent = ""; try { await PB.register(val(), $("#dn").value.trim()); location.href = "/"; } catch (e) { $("#err").textContent = e.message; } });

/* ---------- app ---------- */
async function startApp(view) {
  if (view) S.view = view;
  try { S.me = await api("GET", "/api/me"); } catch { return; }
  await refreshRooms();
  paint();
  connect();
  addEventListener("online", () => { refreshRooms(); connect(); });
  addEventListener("offline", () => { S.live = false; paintStatus(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshRooms(); });
}
async function refreshRooms() {
  try { const d = await api("GET", "/api/rooms"); S.rooms = d.rooms; S.attention = d.attention; S.loaded = true; S.stale = false; }
  catch (e) { if (e.message === "signed out") return; S.stale = true; }
  mood(); if ($("#view")) paintView();
}

let es;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events");
  es.onopen = () => { S.live = true; paintStatus(); };
  es.onerror = () => { S.live = false; paintStatus(); };
  es.addEventListener("hello", e => { const d = JSON.parse(e.data); S.rooms = d.rooms; S.attention = d.attention; S.stale = false; mood(); paintView(); });
  es.addEventListener("room", e => {
    const d = JSON.parse(e.data), i = S.rooms.findIndex(r => r.id === d.id), old = S.rooms[i];
    if (i < 0) S.rooms.push(d); else S.rooms[i] = d;
    if (old && d.last && (!old.last || old.last.ms !== d.last.ms)) ripple(d.id);
    paintView(true);
  });
  es.addEventListener("gone", e => { S.rooms = S.rooms.filter(r => r.id !== JSON.parse(e.data).id); paintView(); });
  es.addEventListener("attention", e => {
    const prev = new Set(S.attention.map(a => a.id));
    S.attention = JSON.parse(e.data).items;
    for (const a of S.attention) if (!prev.has(a.id) && a.urgent) { toast(a.title); localNotify(a); }
    mood(); paintChrome();
  });
  es.addEventListener("bye", () => { location.href = "/"; });
}
function localNotify(a) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  swReady().then(reg => reg.showNotification(a.title, {tag: "pb-" + a.id, body: a.body || "", icon: "/icon-192.png", data: {url: `/r/${a.room}/`}})).catch(() => {});
}
function mood() {
  const m = S.attention.some(a => a.urgent) ? "alert" : S.rooms.some(r => r.state === "live") ? "live" : "calm";
  document.documentElement.dataset.mood = m;
  const n = S.attention.length;
  document.title = (n ? `(${n}) ` : "") + "Playbox";
  if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

/* ---------- constellation ---------- */
const orbit = {angles: {}, raf: 0, last: 0};
const W = 760, H = 600, CX = W / 2, CY = H / 2, RING = {mine: 138, shared: 248};
function constellation() {
  const byKind = k => S.rooms.filter(r => r.kind === k);
  for (const k of ["mine", "shared"]) {
    const rs = byKind(k);
    rs.forEach((r, i) => { if (orbit.angles[r.id] === undefined) orbit.angles[r.id] = (i / rs.length) * 6.2832 + (k === "shared" ? .6 : 0); });
  }
  const nodes = S.rooms.map(r => {
    const rad = 21 + Math.min(r.members, 8) * 1.6, dots = Math.min(r.members, 8);
    const md = Array.from({length: dots}, (_, i) => { const a = i / dots * 6.2832; return `<circle cx="${((rad + 8) * Math.cos(a)).toFixed(1)}" cy="${((rad + 8) * Math.sin(a)).toFixed(1)}" r="2.3"/>`; }).join("");
    const label = r.label.length > 18 ? r.label.slice(0, 17) + "…" : r.label;
    return `<a href="/r/${r.id}/" aria-label="${esc(r.label)}: ${STATE_TXT[r.state] || ""}${r.unread ? `, ${r.unread} unread` : ""}"><g class="node ${r.state}" data-node="${r.id}" transform="translate(${CX} ${CY})">
      <title>${esc(r.label)} · ${esc(STATE_TXT[r.state] || "")}${r.machine ? " · " + esc(r.machine) : ""}</title>
      <g class="ripples"></g><circle class="halo" r="${rad}"/><circle class="body" r="${rad}"/>
      <g class="mdots">${md}</g>
      <clipPath id="cp${r.id}"><circle r="${rad - 3}"/></clipPath><g clip-path="url(#cp${r.id})"><g transform="translate(${-(rad - 3)} ${-(rad - 3)})">${sigil(r.id, (rad - 3) * 2)}</g></g>
      <text y="${rad + 22}">${esc(label)}</text>${r.machine ? `<text class="sub" y="${rad + 35}">${esc(r.machine)}</text>` : ""}
      ${r.unread ? `<circle class="nb" cx="${rad * .72}" cy="${-rad * .72}" r="9"/><text class="nbt" x="${rad * .72}" y="${-rad * .72 + 3.5}">${r.unread > 9 ? "9+" : r.unread}</text>` : ""}</g></a>`;
  }).join("");
  const edges = S.rooms.map(r => `<line class="edge" data-edge="${r.id}" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY}"/>`).join("");
  return `<svg class="const" viewBox="${CX - 300} ${CY - 285} 600 575" role="group" aria-label="Your rooms as a constellation">
    <circle class="orbit" cx="${CX}" cy="${CY}" r="${RING.mine}"/><circle class="orbit" cx="${CX}" cy="${CY}" r="${RING.shared}"/>
    <text class="olabel" x="${CX}" y="${CY - RING.mine - 8}" text-anchor="middle">mine</text><text class="olabel" x="${CX}" y="${CY - RING.shared - 8}" text-anchor="middle">shared</text>
    ${edges}<g class="node me"><circle class="body" cx="${CX}" cy="${CY}" r="30"/><circle cx="${CX}" cy="${CY}" r="7" fill="var(--gold)"/><text x="${CX}" y="${CY + 50}">this hub</text></g>${nodes}</svg>`;
}
function placeNodes() {
  const svg = $(".const"); if (!svg) return;
  for (const r of S.rooms) {
    const a = orbit.angles[r.id] ?? 0, R = RING[r.kind] ?? RING.shared;
    const x = CX + R * Math.cos(a), y = CY + R * Math.sin(a * (r.kind === "mine" ? 1 : 1) ) * .92;
    const n = svg.querySelector(`[data-node="${r.id}"]`); if (n) n.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    const e = svg.querySelector(`line[data-edge="${r.id}"]`);
    if (e) { e.setAttribute("x2", x.toFixed(1)); e.setAttribute("y2", y.toFixed(1)); e.style.strokeOpacity = r.state === "live" ? .55 : r.state === "hold" ? .7 : .18; e.style.stroke = r.state === "hold" ? "var(--gold)" : r.state === "live" ? "var(--ok)" : ""; }
  }
}
function startOrbit() {
  cancelAnimationFrame(orbit.raf); placeNodes();
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  orbit.last = performance.now();
  const step = t => {
    if (!$(".const")) return;
    const dt = Math.min(.1, (t - orbit.last) / 1000); orbit.last = t;
    if (!document.hidden) { for (const r of S.rooms) orbit.angles[r.id] = (orbit.angles[r.id] ?? 0) + dt * (r.kind === "mine" ? .035 : -.02); placeNodes(); }
    orbit.raf = requestAnimationFrame(step);
  };
  orbit.raf = requestAnimationFrame(step);
}
function ripple(id) {
  const g = document.querySelector(`[data-node="${id}"] .ripples`); if (!g) return;
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("class", "ripple"); c.setAttribute("r", "22"); g.appendChild(c);
  c.addEventListener("animationend", () => c.remove());
}

    sheet().innerHTML = `<form method="dialog"><h2>Add a device</h2><p class="mut" style="margin-top:0">Open this link on the new device within 10 minutes. It works once.</p>
      <div class="card mono" style="word-break:break-all;user-select:all">${esc(url)}</div>
      <p class="mut" style="font-size:13px">${location.protocol === "https:" ? "" : "This address is plain HTTP, so the new device can only pair without a passkey. Open the hub's HTTPS address for passkeys."}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="cp" value="x">Copy</button>${navigator.share ? '<button class="btn" id="sh" value="x">Share</button>' : ""}<button class="btn primary" value="cancel">Done</button></div></form>`;
    $("#cp").addEventListener("click", async e => { e.preventDefault(); try { await navigator.clipboard.writeText(url); toast("Copied"); } catch { toast("Copy failed", true); } });
    $("#sh")?.addEventListener("click", e => { e.preventDefault(); navigator.share({url}).catch(() => {}); });
    sheet().showModal();
  } catch (e) { toast(e.message, true); }
}

/* ---------- push + install ---------- */
const swReady = (ms = 2500) => Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error("The service worker isn't running in this browser.")), ms))]);
async function pushState() {
  const b = $("#pushbtn"); if (!b) return;
  if (!("serviceWorker" in navigator && "PushManager" in window && "Notification" in window)) { b.textContent = "Not supported here"; b.disabled = true; return; }
  if (!window.isSecureContext) { b.textContent = "Needs HTTPS"; b.disabled = true; return; }
  let reg; try { reg = await swReady(); } catch { b.textContent = "Unavailable in this browser"; b.disabled = true; return; }
  const sub = await reg.pushManager.getSubscription();
  b.textContent = Notification.permission === "denied" ? "Blocked in browser settings" : sub ? "Turn off notifications" : "Turn on notifications";
  b.disabled = Notification.permission === "denied"; b.dataset.on = sub ? "1" : "";
}
async function togglePush() {
  let reg, sub;
  try { reg = await swReady(); sub = await reg.pushManager.getSubscription(); } catch (e) { return toast(e.message, true); }
  try {
    if (sub) { await api("POST", "/api/push/unsubscribe", {endpoint: sub.endpoint}); await sub.unsubscribe(); toast("Notifications off"); }
    else {
      if (await Notification.requestPermission() !== "granted") return toast("Permission not granted", true);
      const s = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: PB.unb64u(S.me.push_key)});
      await api("POST", "/api/push/subscribe", {endpoint: s.endpoint}); toast("Notifications on");
    }
  } catch (e) { toast(e.message, true); }
  pushState();
}
let installEvt;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = $("#installbtn"); if (b) { b.hidden = false; $("#installhint").hidden = true; } });
addEventListener("appinstalled", () => toast("Installed"));

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-mode],[data-act]"); if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.mode) { S.mode = t.dataset.mode; store.set("pb.mode", S.mode); return paintView(); }
  const act = t.dataset.act;
  if (act !== "edit" && t.closest("a")) return;
  e.preventDefault();
  if (act === "add") openAdd();
  else if (act === "edit") openEdit(t.dataset.id);
  else if (act === "pairdev") pairDevice();
  else if (act === "push") togglePush();
  else if (act === "install") { installEvt?.prompt(); installEvt = null; t.hidden = true; }
  else if (act === "logout") { await fetch("/api/auth/logout", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}); try { await caches.delete("pb-data"); } catch {} location.href = "/"; }
  else if (act === "rmdev") { if (confirm("Remove this device? It will be signed out and its passkey stops working here.")) try { await api("DELETE", `/api/devices/${encodeURIComponent(t.dataset.id)}`); S.me = await api("GET", "/api/me"); paintView(); } catch (er) { toast(er.message, true); } }
  else if (act === "rmses") { try { await api("DELETE", `/api/sessions/${t.dataset.id}`); S.me = await api("GET", "/api/me"); paintView(); } catch (er) { toast(er.message, true); } }
});
sheet().addEventListener("click", e => { if (e.target === sheet()) sheet().close(); });
boot();
</script>
</body>
</html>
