<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E7E0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Playbox</title>
<script>try{const t=localStorage.getItem("pb.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<style>
/* Playbox cockpit: same tokens as the hub. Paper, ink, one signal colour (orange = look here). */
:root{
  color-scheme:light dark;
  --bg:light-dark(#E9E7E0,#0F0F0E); --bg-2:light-dark(#F4F2EC,#171715); --panel:light-dark(#F4F2EC,#171715); --panel-2:light-dark(#ECEAE2,#1F1F1C); --field:light-dark(#FBFAF7,#0F0F0E);
  --ink:light-dark(#171715,#ECE9E0); --ink-2:light-dark(#3B3A36,#C6C3B8); --mut:light-dark(#68665D,#8F8C80);
  --dim:light-dark(#D9D6CB,#2A2A26); --grid:light-dark(rgba(23,23,21,.07),rgba(236,233,224,.045));
  --line:light-dark(#D5D2C7,#2A2A26); --line-2:light-dark(#B9B5A8,#3F3E38); --edge:light-dark(#171715,#6C6A5F);
  --sig:light-dark(#FF5A1F,#FF6B2C); --sig-ink:light-dark(#B83A0A,#FF8A55); --on-sig:light-dark(#171715,#0F0F0E);
  --ok:light-dark(#17783F,#4CC380); --ok-led:light-dark(#1FA458,#4CC380); --bad:light-dark(#C0143C,#FF4D6D);
  --hard:light-dark(5px 5px 0 #171715,5px 5px 0 #000); --scrim:light-dark(rgba(23,23,21,.5),rgba(0,0,0,.65));
  --r:2px; --nav-h:58px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue","Neue Haas Grotesk",Helvetica,Arial,system-ui,sans-serif;
}
:root[data-theme=light]{color-scheme:light} :root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:22px 22px}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h2{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
a{color:var(--ink)}
.mono{font-family:var(--mono);font-size:12.5px}
.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
[hidden]{display:none!important}

/* layout */
.app{display:grid;min-height:100%;grid-template-columns:1fr}
.rail,.pulse{display:none}
main{min-width:0;padding:0 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;height:calc(40px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;
  background:var(--bg);border-bottom:1px solid var(--edge);margin:0 -14px 16px;padding-left:14px;padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase}
.brand b{display:block;width:12px;height:12px;background:var(--sig);font-size:0}
.pill{display:inline-flex;align-items:center;gap:8px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;background:var(--dim);border:1px solid var(--line-2)}
.dot.on{background:var(--ok-led);border-color:var(--ok-led);animation:blink 2s steps(1) infinite}
.dot.host{background:var(--sig);border-color:var(--sig)}
@keyframes blink{50%{opacity:.3}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--edge)}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--nav-h);background:none;border:0;border-right:1px solid var(--line);
  color:var(--mut);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.nav:last-child{border-right:0}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.nav[aria-current=page]{color:var(--ink);box-shadow:inset 0 3px 0 var(--sig)}
.nav .badge{position:absolute;top:6px;right:calc(50% - 24px);min-width:17px;height:17px;background:var(--sig);color:var(--on-sig);font:700 10px/17px var(--mono);padding:0 4px;text-align:center}
@media (min-width:900px){
  .app{grid-template-columns:208px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:18px 16px;border-right:1px solid var(--edge)}
  .rail .brand{padding:4px 10px 18px}
  .rail .nav{flex-direction:row;justify-content:flex-start;gap:10px;min-height:36px;padding:0 10px;border:0;font-size:11px;box-shadow:none}
  .rail .nav:hover{background:var(--panel-2);color:var(--ink)}
  .rail .nav[aria-current=page]{background:var(--ink);color:var(--bg)}
  .rail .nav .badge{position:static;margin-left:auto}
  .rail .foot{margin-top:auto;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 10px}
  .tabbar,.top .brand{display:none}
  .top{justify-content:flex-end;margin:0 -32px 22px;padding:0 32px}
  main{padding-bottom:48px;max-width:none;margin:0;padding-left:32px;padding-right:32px}
  .content{max-width:760px}
}
@media (min-width:1220px){
  .app{grid-template-columns:208px minmax(0,1fr) 330px}
  .pulse{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 16px;border-left:1px solid var(--edge)}
  .top{display:none}
}

/* surfaces */
.view{display:grid;gap:14px;animation:in .16s steps(4)}
@keyframes in{from{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:16px}
.card>h2:first-child{margin:-16px -16px 14px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.hero{padding:34px 18px;text-align:center}
.hero .glyph{display:block;width:28px;height:28px;margin:0 auto 16px;background:var(--sig);font-size:0}
.hero h1{font:600 18px var(--mono);letter-spacing:.24em;text-transform:uppercase}
.hero p{margin:10px auto 0;max-width:34rem;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.recipes{display:grid;gap:10px}
@media (min-width:640px){.recipes{grid-template-columns:1fr 1fr}}
.recipe{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;color:var(--ink);cursor:pointer;min-height:44px}
.recipe:hover{border-color:var(--edge);box-shadow:inset 3px 0 0 var(--sig)}
.recipe b{display:block;font-weight:600;margin-bottom:2px}
.recipe span{color:var(--mut);font-size:13px}
.quick,.preset{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.quick button,.preset button{background:none;border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink);padding:0 12px;cursor:pointer;min-height:36px;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.quick button:hover,.preset button:hover{border-color:var(--edge);background:var(--panel-2)}
.grid2{display:grid;gap:14px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.stat{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.stat:last-child{border:0}
.stat span:first-child{color:var(--mut)}
.stat span:last-child{text-align:right;overflow-wrap:anywhere}

/* controls */
label{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],textarea,select,input[type=number]{width:100%;background:var(--field);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 11px;font-size:16px}
textarea{resize:vertical;min-height:84px}
textarea.mono,input.mono{font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sig);outline-offset:0;border-color:var(--edge)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;border-radius:var(--r);
  font:600 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;box-shadow:0 2px 0 var(--edge)}
.btn:hover{background:var(--panel-2)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary,.btn.gold{background:var(--sig);color:var(--on-sig)}
.btn.primary:hover,.btn.gold:hover{background:color-mix(in srgb,var(--sig) 88%,var(--ink))}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.sm{min-height:32px;padding:0 11px;font-size:10.5px}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:var(--r);background:var(--panel)}
.seg button{border:0;background:none;padding:0 14px;min-height:36px;cursor:pointer;color:var(--mut);font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;min-height:36px;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink)}
.switch input{width:18px;height:18px;accent-color:var(--sig)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--line-2);color:var(--mut);border-radius:2px}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.bad{color:var(--bad);border-color:var(--bad)} .chip.warn{color:var(--sig-ink);border-color:var(--sig-ink)}

/* message log: other people's text keeps the orange stripe, because it is untrusted */
.feed{display:grid;gap:8px;align-content:start}
.msg{max-width:90%;padding:9px 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);overflow-wrap:anywhere}
.msg .who{display:flex;gap:8px;align-items:center;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.msg.me{margin-left:auto;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.msg.me .who{color:inherit;opacity:.7}
.msg.peer{border-left:4px solid var(--sig)}
.sys{text-align:center;font:500 11px var(--mono);color:var(--mut)}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));padding:10px;background:var(--panel);border:1px solid var(--edge);box-shadow:var(--hard)}
@media (min-width:900px){.composer{bottom:16px}}
.composer input{flex:1}
.at{color:var(--sig-ink,var(--sig));font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tags button{font:600 11px/1 var(--mono);letter-spacing:.04em;padding:6px 8px;background:var(--panel);border:1px solid var(--line-2,var(--edge));color:var(--ink);cursor:pointer;border-radius:2px}
.tags button:hover,.tags button:focus-visible{border-color:var(--sig-ink,var(--sig))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* output */
pre{margin:0;padding:12px;background:var(--field);border:1px solid var(--line-2);border-radius:var(--r);overflow:auto;font:12.5px/1.55 var(--mono);max-height:340px;white-space:pre-wrap;overflow-wrap:anywhere}
pre .add{color:var(--ok)} pre .del{color:var(--bad)} pre .hdr{color:var(--sig-ink)}
.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line-2)}
.member:last-child{border:0}
.avatar{width:36px;height:36px;display:grid;place-items:center;font:700 12px var(--mono);letter-spacing:.04em;background:var(--ink);color:var(--bg);flex:none}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.link-box{word-break:break-all;max-height:5.2em;overflow:hidden;padding:10px 12px;background:var(--field);border:1px dashed var(--sig);color:var(--sig-ink)}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r);padding:20px;max-width:min(420px,calc(100vw - 32px));box-shadow:var(--hard)}
dialog::backdrop{background:var(--scrim)}
dialog h2{color:var(--ink)}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:30;padding:0 14px}
@media (min-width:900px){.toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-left:4px solid var(--sig);padding:10px 16px;max-width:560px;font:600 11.5px var(--mono);letter-spacing:.04em;box-shadow:var(--hard)}
.toast.err{border-left-color:var(--bad)}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* witness hold */
.hold{display:none;gap:14px;align-items:flex-start;margin:4px 0 14px;padding:14px 16px;background:color-mix(in srgb,var(--sig) 10%,var(--panel));border:1px solid var(--sig);border-left-width:5px}
.hold.on{display:flex;animation:in .16s steps(4)}
.hold svg{width:28px;height:28px;flex:none;stroke:var(--sig-ink);fill:none;stroke-width:1.7;stroke-linecap:square}
.hold b{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sig-ink)}
.hold p{margin:3px 0 0;font-size:14px}
.hold code{font:600 12.5px var(--mono);background:var(--field);padding:1px 6px;border:1px solid var(--line-2)}

/* hash chain: one lit segment per entry */
.chain{display:flex;flex-wrap:wrap;gap:3px;margin:14px 0 6px}
.chain i{width:12px;height:22px;background:var(--ok-led);opacity:0;animation:blk .3s steps(3) forwards}
.chain i.bad{background:var(--bad)}
.chain i.dim{background:var(--dim)}
@keyframes blk{to{opacity:1}}
.chain-note{font:500 11.5px var(--mono);color:var(--mut);margin:0}
.verdict{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.verdict.ok{color:var(--ok);border-color:var(--ok)} .verdict.bad{color:var(--bad);border-color:var(--bad)}
.verdict span.mut{font-weight:500;text-transform:none;letter-spacing:0}
.evt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.evt:last-child{border:0}
.evt time{color:var(--mut);font:12px var(--mono);min-width:48px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Primary">
    <div class="brand"><b></b> <span class="bk">Playbox</span></div>
    <div id="railnav"></div>
    <div class="foot" id="railfoot"></div>
  </aside>

  <main>
    <header class="top">
      <div class="brand"><b></b> <span class="bk">Playbox</span></div>
      <span class="pill" id="pill"><span class="dot"></span><span>Connecting…</span></span>
    </header>
    <div class="content"><div class="hold" id="holdbar" role="alert"></div><section id="view" aria-live="polite"></section></div>
  </main>

  <aside class="pulse" id="pulse" aria-label="Room pulse"></aside>
</div>

<nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="/auth.js" onerror="void 0"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = s => !s ? "" : s.length > 14 ? s.slice(0, 6) + "…" + s.slice(-4) : s;
const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const hue = s => { let h = 0; for (const c of s || "x") h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (id, label) => `<span class="avatar">${esc((label || id || "?").slice(0, 2).toUpperCase())}</span>`;

const ICONS = {
  room: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
  feed: '<path d="M4 5h16v11H9l-5 4z"/>',
  work: '<path d="M7 7l-4 5 4 5M17 7l4 5-4 5M14 5l-4 14"/>',
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6M16 5.2a3.2 3.2 0 010 5.8M18 14.3c1.7.8 3 2.7 3 5.7"/>',
  proof: '<path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.100-8-4.500-8-9V6z"/><path d="M8.500 12l2.500 2.500 4.500-5"/>',
};
const TABS = [["room", "Room"], ["feed", "Feed"], ["work", "Work"], ["people", "People"], ["proof", "Proof"]];

const S = {tab: "room", status: null, ok: false, feed: [], seq: 0, invite: null, hostArgs: {}, running: false, unread: 0, lastWork: null, verify: null, holds: [], hold: [], tamper: null};

/* ---------- api ---------- */
const BASE = (location.pathname.match(/^\/r\/[^/]+\//) || ["/"])[0];     // under the hub a room lives at /r/<id>/
const HUB = BASE !== "/";
let ROOM = "";       // the room's name, from the hub (a standalone cockpit has none)
const qn = () => ROOM ? `“${esc(ROOM)}”` : "";
const gfetch = (u, i) => typeof PB !== "undefined" ? PB.guarded(u, i) : fetch(u, i);
async function api(name, args = {}, poll = false) {
  let r;
  try {
    r = await gfetch(BASE + "api/tool", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name, args, poll})});
  } catch (e) { return {error: true, data: e && e.message && e.message.includes("passkey") ? e.message : "Can't reach the Playbox UI server."}; }
  if (r.status === 401) { if (HUB) location.href = "/"; else location.reload(); return {error: true, data: "Locked"}; }
  return r.json();
}
const msgOf = d => typeof d === "string" ? d : (d && (d.error || d.message)) || JSON.stringify(d);

function toast(text, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = text;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3200);
}

/* ---------- derived state ---------- */
const hosting = () => S.status && S.status.hosting;
const joined = () => S.status && S.status.joined;
const myId = () => (joined() && joined().member_id) || (S.status && S.status.guest_id) || "";
const members = () => (hosting() && hosting().members) || [];
function mode() { return hosting() && joined() ? "both" : hosting() ? "host" : joined() ? "guest" : "none"; }

function paintPill() {
  const m = mode();
  const txt = !S.ok ? "Offline" : m === "none" ? "No room" : m === "guest" ? "In a room" : `Hosting · ${members().length} member${members().length === 1 ? "" : "s"}`;
  const cls = m === "none" || !S.ok ? "" : m === "guest" ? "on" : "host";
  $("#pill").innerHTML = `<span class="dot ${cls}"></span><span>${esc(txt)}</span>`;
  $("#railfoot").innerHTML = `<span class="dot ${cls}" style="display:inline-block;margin-right:7px"></span>${esc(txt)}`;
}

function paintNav() {
  const html = TABS.map(([id, label]) => {
    const badge = id === "feed" && S.unread ? `<span class="badge" aria-label="${S.unread} new">${S.unread > 9 ? "9+" : S.unread}</span>` : "";
    return `<button class="nav" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id === "people" ? "people" : id]}</svg><span>${label}</span>${badge}</button>`;
  }).join("");
  $("#tabbar").innerHTML = html;
  $("#railnav").innerHTML = html;
}


/* ---------- built-in use cases ---------- */

  {t: "Find TODOs", d: "Leftover TODO and FIXME notes, first 60 lines.", cmd: `grep -rIn -E "TODO|FIXME" . 2>/dev/null | grep -v '^\\./\\.git/' | head -n 60; echo "TODO scan finished"`},
  {t: "Look for leaked secrets", d: "Cloud keys, private keys and tokens in any file.", cmd: `grep -rIEn "AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{24,}" . 2>/dev/null | grep -v '^\\./\\.git/' | cut -c1-140 | head -n 20; echo "secret scan finished"`},
  {t: "Largest files", d: "The 12 biggest files, in bytes.", cmd: `find . ${NO_GIT} -type f -exec wc -c {} + | sort -rn | head -n 13`},
  {t: "File types", d: "How many files of each extension.", cmd: `find . ${NO_GIT} -type f -print | sed -n 's/.*\\.//p' | sort | uniq -c | sort -rn | head -n 12; echo; echo "files: $(find . ${NO_GIT} -type f -print | wc -l)"`},
  {t: "Check shell scripts", d: "Syntax-check every .sh file with sh -n.", cmd: `n=0; for f in $(find . ${NO_GIT} -name '*.sh' -type f -print); do n=$((n+1)); if sh -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fi; done; echo "$n script(s) checked"`},

function emptyCard(t) { return `<div class="card empty"><span class="glyph" style="display:block;width:20px;height:20px;margin:0 auto 12px;background:var(--sig)"></span><p>${esc(t)}</p></div>`; }

const ORIGIN = {"room:feed": "the room feed", "room:delegate": "a delegated task result", "room:recall": "shared room memory",
  "room:steer": "a steering message", "room:memory_ingest": "ingested memory", "room:memory_export": "exported memory", "room workspace file": "a file from a peer's workspace"};
const originText = o => ORIGIN[o] || o || "a peer";

function chain(total, brokenAt) {
  const N = Math.min(total, 48), per = total / N;
  const bad = brokenAt == null ? -1 : Math.min(N - 1, Math.floor(brokenAt / per));
  let h = "";
  for (let k = 0; k < N; k++) h += `<i class="${bad < 0 ? "" : k === bad ? "bad" : k > bad ? "dim" : ""}" style="animation-delay:${k * 14}ms"></i>`;
  return `<div class="chain" role="img" aria-label="${bad < 0 ? "Every entry links to the one before" : "The chain breaks at entry " + brokenAt}">${h}</div>
    <p class="chain-note">${total} entries${per > 1.5 ? `, each block is about ${Math.round(per)}` : ""}. Each one holds the hash of the entry before it.</p>`;
}

function renderTamper(t) {
  if (t.error && !t.entries) return `<div class="verdict bad">${esc(t.error)}</div>`;
  const m = /entry (\d+)/.exec(t.message || "");
  const at = m ? +m[1] : null;
  return `${chain(t.entries, at == null ? Math.floor(t.entries / 2) : at)}
    <div class="verdict ${t.valid ? "ok" : "bad"}">${t.valid ? "✓ Still valid (the flipped byte was not covered)" : `✕ Caught${at != null ? ` at entry ${at}` : ""}`}
      <span class="mut">byte ${t.offset} of ${t.bytes} flipped in a copy</span></div>
    ${t.message && !t.valid ? `<pre style="margin-top:10px">${esc(t.message)}</pre>` : ""}`;
}

function renderHolds() {
  const ev = S.holds.slice(-8).reverse();
  if (!ev.length) return `<p class="mut" style="margin:0">No holds yet. When the witness plugin pauses your Hermes agent after it reads another member's text, it shows here. Only the tool name and where the text came from are kept, never the text.</p>`;
  return ev.map(e => `<div class="evt"><time>${esc(hhmm(e.ts))}</time>
      <span class="chip ${e.kind === "held" ? "warn" : "ok"}">${e.kind === "held" ? "held" : "released"}</span>
      <span class="grow">${e.kind === "held" ? `<span class="mono">${esc(e.tool || "")}</span> <span class="mut">after ${esc(originText(e.origin))}</span>` : `<span class="mut">your next message lifted it</span>`}</span></div>`).join("");
}

function renderVerify(v) {
  const ok = v.valid === true;
  return `${v.entries != null && ok ? chain(v.entries) : ""}
    <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "✓ Chain valid" : "✕ Not valid"}
      ${v.entries != null ? `<span class="mut">${v.entries} entries${v.head ? " · head " + esc(short(v.head)) : ""}</span>` : ""}</div>
    ${(v.problems || []).length ? `<pre style="margin-top:10px">${esc(v.problems.join("\n"))}</pre>` : ""}
    ${v.error ? `<pre style="margin-top:10px">${esc(v.error)}</pre>` : ""}`;
}

function renderResult(w) {
  const lines = (w.patch || "").split("\n").map(l => {
    const c = l.startsWith("+++") || l.startsWith("---") || l.startsWith("diff") ? "hdr" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
  }).join("\n");
  const ok = w.exit_code === 0 && !w.timed_out;
  return `<div class="card"><h2>Result</h2>
    <div class="row"><span class="chip ${ok ? "ok" : "bad"}">${w.timed_out ? "timed out" : "exit " + w.exit_code}</span>
      ${w.runner ? `<span class="chip">${esc(w.runner)}</span>` : ""}${w.patch_applied ? '<span class="chip ok">patch applied</span>' : ""}</div>
    ${w.stdout ? `<label>Output</label><pre>${esc(w.stdout)}</pre>` : ""}
    ${w.stderr ? `<label>Errors</label><pre>${esc(w.stderr)}</pre>` : ""}
    ${w.patch ? `<label>Patch · ${w.patch_bytes ?? w.patch.length} bytes${w.patch_truncated ? " (truncated)" : ""}</label><pre>${lines}</pre>` : ""}</div>`;
}

/* ---------- feed ---------- */
const atHtml = t => esc(t).replace(/(^|[\s(])@([\w.\-]{1,40})/g, '$1<span class="at">@$2</span>');
const tagOf = n => String(n).trim().replace(/\s+/g, "-").slice(0, 40);
function tagTargets() {
  const out = [{tag: "all", label: "Everyone"}], seen = new Set(["all"]);
  const add = (tag, label) => { const k = tag.toLowerCase(); if (tag && !seen.has(k)) { seen.add(k); out.push({tag, label}); } };
  for (const it of S.feed) if (it.kind === "say" && it.name && it.from !== myId()) add(tagOf(it.name), it.name);
  for (const id of members()) add(id.slice(0, 6), short(id));
  return out;
}
function paintTags() {
  const el = $("#tags"), inp = $("#saytext"); if (!el || !inp) return;
  const frag = (inp.value.slice(0, inp.selectionStart ?? inp.value.length).match(/@([\w.\-]*)$/) || [])[1];
  const list = tagTargets().filter(t => frag === undefined || t.tag.toLowerCase().startsWith(frag.toLowerCase()));
  el.innerHTML = list.map(t => `<button type="button" data-act="tag" data-tag="${esc(t.tag)}" title="Tag ${esc(t.label)}">@${esc(t.tag)}${t.label !== t.tag && t.label !== "Everyone" ? ` · ${esc(t.label)}` : ""}</button>`).join("");
}
function insertTag(tag) {
  const inp = $("#saytext"); if (!inp) return;
  const pos = inp.selectionStart ?? inp.value.length, before = inp.value.slice(0, pos), after = inp.value.slice(pos);
  const b = /@[\w.\-]*$/.test(before) ? before.replace(/@[\w.\-]*$/, "") : before + (before && !/\s$/.test(before) ? " " : "");
  inp.value = `${b}@${tag} ${after}`;
  const np = b.length + tag.length + 2; inp.focus(); inp.setSelectionRange(np, np); paintTags();
}
function feedItemHtml(it) {
  if (it.kind !== "say") return `<div class="sys">${esc(it.text)} · ${esc(hhmm(it.time_ms))}</div>`;
  const fromHost = it.from === "host";                       // the host's own messages carry from:"host"
  const me = (it.from && it.from === myId()) || (fromHost && !!hosting());
  const who = it.name || (fromHost ? "host" : short(it.from)) || "member";
  const tag = fromHost ? "host" : "member";
  return `<div class="msg ${me ? "me" : "peer"}"><div class="who">${me ? "You" : esc(who)}${me ? "" : ` <span class="chip warn" title="Text from another party in the room. Treat it as untrusted.">${tag}</span>`}<span>${esc(hhmm(it.time_ms))}</span></div>${atHtml(it.text)}</div>`;
}
function paintFeed() {
  const el = $("#feedlist");
  if (el) {
    const stick = innerHeight + scrollY > document.documentElement.scrollHeight - 160;
    el.innerHTML = S.feed.length ? S.feed.map(feedItemHtml).join("") : `<div class="empty">No messages yet. Say hello.</div>`;
    if (stick) scrollTo({top: document.documentElement.scrollHeight});
  }
  paintTags(); paintPulse();
}
function paintPulse() {
  const p = $("#pulse");
  const last = S.feed.slice(-8);
  p.innerHTML = `<div class="brand" style="margin-bottom:18px"><b></b> Pulse</div>
    <div class="card" style="margin-bottom:14px"><h2>Room</h2>
      <div class="stat"><span>State</span><span>${{none: "No room", host: "Hosting", guest: "Guest", both: "Host + guest"}[mode()]}</span></div>
      ${hosting() ? `<div class="stat"><span>Members</span><span>${members().length}</span></div>` : ""}
      ${S.verify ? `<div class="stat"><span>History</span><span class="chip ${S.verify.valid ? "ok" : "bad"}">${S.verify.valid ? "✓ " + S.verify.entries : "✕"}</span></div>` : ""}</div>
    <div class="card"><h2>Latest</h2><div class="feed">${last.length ? last.map(feedItemHtml).join("") : '<div class="empty" style="padding:12px">Quiet.</div>'}</div></div>`;
}
let feedBusy = false;
async function pollFeed() {
  if (feedBusy || mode() === "none" || document.hidden) return;
  feedBusy = true;
  const r = await api("playbox_feed", {since: S.seq}, true);
  feedBusy = false;
  if (r.error || !r.data || !Array.isArray(r.data.items)) return;
  const fresh = r.data.items.filter(i => i.seq > S.seq);
  if (!fresh.length) return;
  S.seq = Math.max(S.seq, ...fresh.map(i => i.seq));
  S.feed.push(...fresh);
  if (S.tab !== "feed") { S.unread += fresh.filter(i => i.kind === "say" && i.from !== myId()).length; paintNav(); }
  paintFeed();
}

/* ---------- witness ---------- */
const HOLD_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.500-3.200 7.900-8 9-4.800-1.100-8-4.500-8-9V6z"/><path d="M12 8v5M12 16.200v.1"/></svg>';
function paintHold() {
  const el = $("#holdbar"), a = S.hold;
  if (!a.length) { el.className = "hold"; el.innerHTML = ""; return; }
  const e = a[a.length - 1];
  const fresh = !el.classList.contains("on");
  el.innerHTML = `${HOLD_ICON}<div><b>Witness paused your agent</b>
    <p>Hermes tried <code>${esc(e.tool || "a write")}</code> after reading ${esc(originText(e.origin))}. Text from another member can't trigger changes on its own, so it waits for you.</p>
    <p class="mut" style="font-size:13px">Reply in Hermes to go ahead or to say no. Your next message lifts the hold.${a.length > 1 ? ` ${a.length} sessions are held.` : ""}</p></div>`;
  el.className = "hold on";
  if (fresh) toast("Witness paused a write");
}
async function pollWitness() {
  let r;
  try { r = await (await fetch(BASE + "api/witness")).json(); } catch { return; }
  const was = S.hold.length;
  S.holds = r.events || []; S.hold = r.active || [];
  if (was && !S.hold.length) toast("Hold lifted");
  paintHold();
  if (S.tab === "proof" && !document.activeElement.closest?.("#view")) { const c = $("#view .card:nth-of-type(3)"); if (c) c.innerHTML = "<h2>Witness holds</h2>" + renderHolds(); }
}

/* ---------- hub: back to all rooms ---------- */
if (HUB) {
  fetch("/api/rooms").then(r => r.ok ? r.json() : null).then(d => {
    const x = d && d.rooms.find(r => r.id === BASE.split("/")[2]);
    if (!x) return;
    ROOM = x.label; document.title = `${x.label} · Playbox`;
    if (!document.activeElement.closest?.("#view")) show(S.tab);
  }).catch(() => {});
  document.querySelectorAll(".brand .bk").forEach(el => { el.outerHTML = '<a class="bk" href="/" style="color:inherit;text-decoration:none" aria-label="All rooms">‹ Rooms</a>'; });
  const st = document.createElement("style");
  st.textContent = "@media(max-width:899px){.top .brand{display:flex!important}}";
  document.head.appendChild(st);
}

/* ---------- state ---------- */
async function refresh(poll) {
  try {
    const r = await (await fetch(BASE + "api/state")).json();
    const before = mode() + members().length;
    S.ok = r.ok; S.status = r.ok ? r.status : S.status;
    paintPill();
    if (poll && before !== mode() + members().length && ["people", "room"].includes(S.tab) && !document.activeElement.closest?.("#view")) show(S.tab);
    paintPulse();
  } catch { S.ok = false; paintPill(); }
}
function show(tab) {
  S.tab = tab;
  if (tab === "feed") S.unread = 0;
  paintNav();
  const v = $("#view");
  v.innerHTML = `<div class="view">${VIEWS[tab]()}</div>`;
  if (tab === "feed") { paintFeed(); pollFeed(); }
  scrollTo({top: 0});
}

/* ---------- actions ---------- */
const val = id => ($("#" + id) || {}).value || "";
const chk = id => !!($("#" + id) || {}).checked;
function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }

async function act(name, btn) {
  const reach = $('[data-reach][aria-pressed=true]');
  const run = async (tool, args, ok) => {
    busy(btn, true);
    const r = await api(tool, args);
    busy(btn, false);
    if (r.error) { toast(msgOf(r.data), true); return null; }
    if (ok) toast(ok);
    return r.data;
  };
  switch (name) {
    case "create": {
      const repo = val("repo").trim();
      const args = {docker: chk("docker"), ...(repo ? {repo} : {})};
      if (reach && reach.dataset.reach === "local") args.local = true;
      const d = await run("playbox_create", args, "Room created");
      if (d) { S.hostArgs = args; S.invite = d.link; await refresh(); show("room"); }
      break;
    }
    case "invite": {
      const d = await run("playbox_create", S.hostArgs, "New single-use link");
      if (d) { S.invite = d.link; show("room"); }
      break;
    }
    case "join": {
      const link = val("link").trim().replace(/\s+/g, "");
      if (!link.startsWith("playbox://")) return toast("That doesn't look like a Playbox link.", true);
      const d = await run("playbox_join", {link}, "Joined");
      if (d) { S.feed = []; S.seq = 0; await refresh(); show("room"); }
      break;
    }
    case "leave": {
      if (await run("playbox_leave", {}, "Left the room")) { S.feed = []; S.seq = 0; await refresh(); show("room"); }
      break;
    }
    case "pull": {
      const d = await run("playbox_pull", {ref: val("ref") || "main", checkout: chk("checkout")}, null);
      if (d) toast(`Pulled ${d.ref || "branch"} · ${short(d.head || "")}`);
      break;
    }
    case "push": {
      const d = await run("playbox_push", {ref: val("ref") || "main"}, "Pushed under your name");
      break;
    }
    case "run": case "run-noapply": {
      if (!val("cmd").trim()) return toast("Enter a command to run.", true);
      const apply = name === "run" && chk("apply");
      busy(btn, true);
      const r = await api("playbox_delegate", {base: val("base") || "main", command: val("cmd"), timeout_secs: +val("tmo") || 120, network: chk("net"), apply});
      busy(btn, false);
      const box = $("#result");
      if (r.error) {
        const m = msgOf(r.data);
        box.innerHTML = `<div class="card"><h2>Task did not finish cleanly</h2><p style="margin:0 0 12px">${esc(m)}</p>
          ${/applying patch/.test(m) ? `<p class="mut" style="font-size:13px;margin:0 0 12px">The task ran on the host, but its patch doesn't fit your folder (for example a file it creates is already there). Run it again without applying to read the output and patch.</p>
          <button class="btn" data-act="run-noapply">Run again without applying</button>` : ""}</div>`;
      } else { S.lastWork = r.data; box.innerHTML = renderResult(r.data); }
      box.scrollIntoView({behavior: "smooth", block: "nearest"});
      break;
    }
    case "verify": case "verify-path": {
      const path = name === "verify" ? S.status.history_log : val("vpath").trim();
      if (!path) return toast("Enter a log path.", true);
      busy(btn, true);
      const r = await api("playbox_verify", {path});
      busy(btn, false);
      S.verify = r.error ? {valid: false, error: msgOf(r.data)} : r.data;
      $("#vres").innerHTML = renderVerify(S.verify);
      paintPulse();
      break;
    }
    case "tamper": {
      busy(btn, true);
      const r = await (await fetch(BASE + "api/tamper", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path: S.status.history_log})})).json();
      busy(btn, false);
      if (r.error && !r.result && !r.bytes) { toast(r.error, true); break; }
      const res = r.result, valid = !r.error && res && res.valid === true;
      S.tamper = {valid, entries: r.entries, offset: r.offset, bytes: r.bytes, message: typeof res === "string" ? res : (res && (res.error || (res.problems || []).join("\n"))) || ""};
      $("#tres").innerHTML = renderTamper(S.tamper);
      break;
    }
    case "preset": {
      const x = PRESETS[+btn.dataset.i];
      document.querySelectorAll("[data-reach]").forEach(b => b.setAttribute("aria-pressed", b.dataset.reach === x.reach));
      $("#docker").checked = x.docker;
      toast(x.t + ": set. Add a repository path and create.");
      break;
    }
    case "recipe": {
      const x = RECIPES[+btn.dataset.i];
      $("#cmd").value = x.cmd; $("#apply").checked = false; $("#net").checked = false; $("#tmo").value = 180;
      act("run", $("#runbtn"));
      break;
    }
    case "quick": {
      const r = await api("playbox_say", {text: btn.dataset.text});
      if (r.error) return toast(msgOf(r.data), true);
      pollFeed();
      break;
    }
    case "copy-invite": copyText(S.invite); break;
    case "share-invite": navigator.share({title: "Playbox invite", text: S.invite}).catch(() => {}); break;
    case "save-invite": {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([S.invite + "\n"], {type: "text/plain"}));
      a.download = "playbox-invite.txt"; a.click(); URL.revokeObjectURL(a.href);
      break;
    }
  }
}

function copyText(t) {
  const done = () => toast("Copied");
  if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch { toast("Select the link and copy it by hand.", true); }
    ta.remove();
  }
}

function confirmRevoke(id) {
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog"><h2 style="color:var(--ink);font-size:16px">Revoke this member?</h2>
    <p class="mut">${avatar(id)} <span class="mono">${esc(short(id))}</span><br>Their access ends now and they can't rejoin with the same key.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="no">Cancel</button><button class="btn danger" value="yes">Revoke</button></div></form>`;
  d.onclose = async () => {
    if (d.returnValue !== "yes") return;
    const r = await api("playbox_revoke", {member: id});
    if (r.error) return toast(msgOf(r.data), true);
    toast("Revoked");
    await refresh(); show("people");
  };
  d.returnValue = ""; d.showModal();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-act],[data-reach]");
  if (!t) return;
  if (t.dataset.tab) return show(t.dataset.tab);
  if (t.dataset.reach) { document.querySelectorAll("[data-reach]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (t.dataset.act === "tag") return insertTag(t.dataset.tag);
  if (t.dataset.act === "revoke") return confirmRevoke(t.dataset.id);
  act(t.dataset.act, t);
});
document.addEventListener("input", e => { if (e.target.id === "saytext") paintTags(); });
document.addEventListener("keyup", e => { if (e.target.id === "saytext" && /Arrow|Home|End/.test(e.key)) paintTags(); });
document.addEventListener("submit", async e => {
  if (e.target.id !== "say") return;
  e.preventDefault();
  const inp = $("#saytext"), text = inp.value.trim();
  if (!text) return;
  inp.value = ""; paintTags();
  const r = await api("playbox_say", {text});
  if (r.error) { inp.value = text; return toast(msgOf(r.data), true); }
  pollFeed();
});

/* ---------- boot ---------- */
paintNav(); paintPulse();
refresh().then(() => show("room")); pollWitness();
let tick = 0;
setInterval(() => {
  if (document.hidden) return;
  tick++;
  pollWitness();
  if (tick % 3 === 0) refresh(true);                       // every call is appended to the signed history, so poll gently
  if (S.tab === "feed" || innerWidth >= 1220) pollFeed();
}, 3500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(true); pollFeed(); } });
</script>
</body>
