<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3EE" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#151713" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Playbox</title>
<script>try{if(sessionStorage.getItem("pb.splat"))document.documentElement.classList.add("pb-splat")}catch{}</script>
<style>html.pb-splat body{visibility:hidden}</style>
<script>try{const t=localStorage.getItem("pb.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<style>
/* Playbox cockpit: same tokens as the hub. Paper, ink, one signal colour (orange = look here). */
:root{
  color-scheme:light dark;
  --bg:light-dark(#F2F3EE,#151713); --bg-2:light-dark(#F4F2EC,#171715); --panel:light-dark(#F4F2EC,#171715); --panel-2:light-dark(#ECEAE2,#1F1F1C); --field:light-dark(#FBFAF7,#151713);
  --ink:light-dark(#171715,#ECE9E0); --ink-2:light-dark(#3B3A36,#C6C3B8); --mut:light-dark(#68665D,#8F8C80);
  --dim:light-dark(#D9D6CB,#2A2A26); --grid:light-dark(rgba(23,23,21,.07),rgba(236,233,224,.045));
  --line:light-dark(#D5D2C7,#2A2A26); --line-2:light-dark(#B9B5A8,#3F3E38); --edge:light-dark(#171715,#6C6A5F);
  --sig:light-dark(#FF5A1F,#FF6B2C); --sig-ink:light-dark(#B83A0A,#FF8A55); --on-sig:light-dark(#171715,#151713);
  --ok:light-dark(#17783F,#4CC380); --ok-led:light-dark(#1FA458,#4CC380); --bad:light-dark(#C0143C,#FF4D6D);
  --hard:light-dark(5px 5px 0 #171715,5px 5px 0 #000); --scrim:light-dark(rgba(23,23,21,.5),rgba(0,0,0,.65));
  --r:8px; --nav-h:58px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue","Neue Haas Grotesk",Helvetica,Arial,system-ui,sans-serif;
}
:root[data-theme=light]{color-scheme:light} :root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:22px 22px}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h2{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
a{color:var(--ink)}
.mono{font-family:var(--mono);font-size:12.5px}
.mut{color:var(--mut)}
.lbl{font:600 10.5px/1.2 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.iconbtn{width:28px;height:28px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);border-radius:var(--r);padding:0;flex:none}
.iconbtn:hover{border-color:var(--edge);color:var(--ink)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter}
.rail-tools{display:flex;align-items:center;gap:6px;padding:0 6px 10px;flex-wrap:wrap}
.top-tools{display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:8px}
.msheet{display:grid;gap:8px;margin-top:12px}
.msheet button,.msheet a{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line-2);background:var(--field);border-radius:var(--r);cursor:pointer;font:600 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;text-align:left;text-decoration:none;color:var(--ink)}
.msheet button:hover,.msheet a:hover,.msheet [aria-current=page]{border-color:var(--edge);background:var(--panel-2)}
.msheet [aria-current=page]{box-shadow:inset 3px 0 0 var(--sig)}
.msheet svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square;flex:none}
.msheet small{margin-left:auto;color:var(--mut);font-weight:500;letter-spacing:.04em}
@media (max-width:520px){#pill span:last-child{display:none}.top-tools{margin-right:4px}}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
[hidden]{display:none!important}

/* layout */
.app{display:grid;min-height:100%;grid-template-columns:1fr}
.rail,.pulse{display:none}
main{min-width:0;padding:0 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;height:calc(40px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;
  background:var(--bg);border-bottom:1px solid var(--edge);margin:0 -14px 16px;padding-left:14px;padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase}
.brand b{display:block;width:18px;height:18px;font-size:0}
.pill{display:inline-flex;align-items:center;gap:8px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;background:var(--dim);border:1px solid var(--line-2)}
.dot.on{background:var(--ok-led);border-color:var(--ok-led);animation:blink 2s steps(1) infinite}
.dot.host{background:var(--sig);border-color:var(--sig)}
@keyframes blink{50%{opacity:.3}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--edge)}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--nav-h);background:none;border:0;border-right:1px solid var(--line);
  color:var(--mut);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.nav:last-child{border-right:0}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.nav[aria-current=page]{color:var(--ink);box-shadow:inset 0 3px 0 var(--sig)}
.nav .badge{position:absolute;top:6px;right:calc(50% - 24px);min-width:17px;height:17px;background:var(--sig);color:var(--on-sig);font:700 10px/17px var(--mono);padding:0 4px;text-align:center}
@media (min-width:900px){
  .app{grid-template-columns:208px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:18px 16px;border-right:1px solid var(--edge)}
  .rail .brand{padding:4px 10px 10px}
  .rail .nav{flex-direction:row;justify-content:flex-start;gap:10px;min-height:36px;padding:0 10px;border:0;font-size:11px;box-shadow:none}
  .rail .nav:hover{background:var(--panel-2);color:var(--ink)}
  .rail .nav[aria-current=page]{background:var(--ink);color:var(--bg)}
  .rail .nav .badge{position:static;margin-left:auto}
  .rail .foot{margin-top:auto;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 10px}
  .tabbar,.top .brand,.top-tools{display:none!important}
  .top{justify-content:flex-end;margin:0 -32px 22px;padding:0 32px}
  main{padding-bottom:48px;max-width:none;margin:0;padding-left:32px;padding-right:32px}
  .content{max-width:760px}
}
@media (min-width:1220px){
  .app{grid-template-columns:208px minmax(0,1fr) 330px}
  .pulse{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 16px;border-left:1px solid var(--edge)}
  .top{display:none}
}

/* surfaces */
.view{display:grid;gap:14px;animation:in .16s steps(4)}
@keyframes in{from{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:16px;overflow:hidden}
.card>h2:first-child{margin:-16px -16px 14px;padding:13px 16px;border-bottom:1px solid var(--line);background:none;font:500 15px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
.hero{padding:34px 18px;text-align:center}
.hero .glyph{display:block;width:44px;height:44px;margin:0 auto 16px;font-size:0}
.hero h1{font:600 18px var(--mono);letter-spacing:.24em;text-transform:uppercase}
.hero p{margin:10px auto 0;max-width:34rem;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.recipes{display:grid;gap:10px}
@media (min-width:640px){.recipes{grid-template-columns:1fr 1fr}}
.recipe{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;color:var(--ink);cursor:pointer;min-height:44px}
.recipe:hover{border-color:var(--edge);box-shadow:inset 3px 0 0 var(--sig)}
.recipe b{display:block;font-weight:600;margin-bottom:2px}
.recipe span{color:var(--mut);font-size:13px}
.quick,.preset{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.quick button,.preset button{background:none;border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink);padding:0 12px;cursor:pointer;min-height:36px;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.quick button:hover,.preset button:hover{border-color:var(--edge);background:var(--panel-2)}
.grid2{display:grid;gap:14px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.stat{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.stat:last-child{border:0}
.stat span:first-child{color:var(--mut)}
.stat span:last-child{text-align:right;overflow-wrap:anywhere}

/* controls */
label{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=search],textarea,select,input[type=number]{width:100%;background:var(--field);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 11px;font-size:16px}
textarea{resize:vertical;min-height:84px}
textarea.mono,input.mono{font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sig);outline-offset:0;border-color:var(--edge)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer;border-radius:var(--r);
  font:600 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;}
.btn:hover{background:var(--panel-2)} .btn:active{transform:scale(.98)}
.btn.primary,.btn.gold{background:var(--sig);color:var(--on-sig)}
.btn.primary:hover,.btn.gold:hover{background:color-mix(in srgb,var(--sig) 88%,var(--ink))}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.sm{min-height:32px;padding:0 11px;font-size:10.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);overflow:hidden}
.seg button{border:0;background:none;padding:0 14px;min-height:36px;cursor:pointer;color:var(--mut);font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;min-height:36px;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink)}
.switch input{width:18px;height:18px;accent-color:var(--sig)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--line-2);color:var(--mut);border-radius:2px}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.bad{color:var(--bad);border-color:var(--bad)} .chip.warn{color:var(--sig-ink);border-color:var(--sig-ink)}

/* message log: other people's text keeps the orange stripe, because it is untrusted */
.feed{display:grid;gap:8px;align-content:start}
.msg{max-width:90%;padding:9px 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);overflow-wrap:anywhere}
.msg .who{display:flex;gap:8px;align-items:center;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.msg.me{margin-left:auto;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.msg.me .who{color:inherit;opacity:.7}
.msg.peer{border-left:4px solid var(--sig)}
.msg-body{line-height:1.5}
.msg pre.pbm-code{margin:6px 0;padding:8px 10px;font-size:12px;color:var(--ink)}
.msg code{font:12px var(--mono);padding:1px 4px;background:var(--field);border:1px solid var(--line-2);color:var(--ink)}
.msg pre code{padding:0;background:none;border:0;color:inherit}
.sys{text-align:center;font:500 11px var(--mono);color:var(--mut)}
.sys-ev,.sys-grp{background:var(--panel-2,var(--field));border:1px solid var(--line-2);border-radius:var(--r);font:500 11.5px/1.45 var(--mono);color:var(--ink-2)}
.sys-ev>summary,.sys-grp>summary{list-style:none;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 10px;cursor:pointer;user-select:none}
.sys-ev>summary::-webkit-details-marker,.sys-grp>summary::-webkit-details-marker{display:none}
.sys-ev>summary:hover,.sys-grp>summary:hover{color:var(--ink)}
.ev-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c-ev,#A78BFA)}
.ev-dot.ok{background:var(--ok-led,var(--ok))}
.ev-dot.bad{background:var(--bad)}
.ev-dot.warn{background:var(--warn,#E5A33D)}
.ev-cnt{padding:1px 6px;border-radius:999px;background:var(--ink);color:var(--bg);font:700 10.5px var(--mono)}
.ev-chip{padding:1px 6px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);font:500 10.5px var(--mono)}
.ev-chip.sec{border-color:color-mix(in srgb,var(--warn,#E5A33D) 45%,var(--line-2))}
.ev-tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap}
.ev-body{border-top:1px dashed var(--line-2);padding:8px 10px;display:grid;gap:8px;background:var(--panel)}
.ev-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 12px;font:11px var(--mono)}
.ev-kv div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.ev-kv span{color:var(--mut)}
.ev-kv b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-runs{display:grid;gap:3px;max-height:220px;overflow:auto;border-top:1px solid var(--line);padding-top:6px;font:11px var(--mono)}
.ev-run{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2)}
.ev-run .seq{color:var(--mut)}
.fb-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.fb-bar .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fintel{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);margin:0 0 12px;overflow:hidden}
.fintel>summary{list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;cursor:pointer;font:600 11.5px var(--mono);color:var(--ink)}
.fintel>summary::-webkit-details-marker{display:none}
.fintel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.fi-card{background:var(--panel-2,var(--field));border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:grid;gap:6px}
.fi-card .fi-h{display:flex;align-items:center;justify-content:space-between;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.fi-card .fi-v{font:700 18px/1.1 var(--mono);color:var(--ink)}
.fi-card .fi-sub{font:11px/1.35 var(--mono);color:var(--ink-2)}
.fi-svg{width:100%;height:38px;display:block}
.ev-spark{width:64px;height:16px;vertical-align:middle;flex:none}
.tl-drill{background:var(--panel-2,var(--field));border:1px solid var(--line-2);border-left:3px solid var(--sig);border-radius:var(--r);padding:12px;margin:0 0 12px;display:grid;gap:10px}
.tl-drill-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 12.5px var(--mono);color:var(--ink)}
.tl-ctx{display:grid;gap:3px;border-top:1px dashed var(--line-2);padding-top:8px;font:11.5px var(--mono);color:var(--ink-2)}
.tl-ctx .cur{color:var(--ink);font-weight:700}
.pbx-card{background:var(--panel);border:1px solid var(--line-2);border-left:4px solid var(--c-ev,#A78BFA);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.pbx-card.st-verified,.pbx-card.st-done{border-left-color:var(--ok-led,var(--ok))}
.pbx-card.st-failed{border-left-color:var(--bad)}
.pbx-card.st-checking,.pbx-card.st-doing{border-left-color:var(--warn,#E5A33D)}
.pbx-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 11px var(--mono);color:var(--mut)}
.pbx-hd .pbx-ttl{font:600 13.5px var(--sans);color:var(--ink)}
.pbx-hd .pbx-st{padding:1px 7px;border-radius:999px;font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line-2);color:var(--ink-2)}
.pbx-hd .pbx-st.ok{border-color:var(--ok-led,var(--ok));color:var(--ok-led,var(--ok))}
.pbx-hd .pbx-st.bad{border-color:var(--bad);color:var(--bad)}
.pbx-hd .pbx-st.warn{border-color:var(--warn,#E5A33D);color:var(--warn,#E5A33D)}
.pbx-stats{display:flex;flex-wrap:wrap;gap:6px}
.pbx-metric{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--panel-2,var(--field));border:1px solid var(--line-2);border-left:3px solid var(--c-you);border-radius:var(--r);font:500 11.5px var(--mono);color:var(--ink-2)}
.pbx-metric b{color:var(--ink);font-size:13px}
@media (max-width:640px){.fintel-grid,.ev-kv{grid-template-columns:1fr}.tl-drill,.pbx-card{padding:8px 10px}.ev-spark{display:none}}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));padding:10px;background:var(--panel);border:1px solid var(--edge);box-shadow:var(--hard)}
@media (min-width:900px){.composer{bottom:16px}}
.composer input{flex:1}
.at{color:var(--sig-ink,var(--sig));font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tags button{font:600 11px/1 var(--mono);letter-spacing:.04em;padding:6px 8px;background:var(--panel);border:1px solid var(--line-2,var(--edge));color:var(--ink);cursor:pointer;border-radius:2px}
.tags button:hover,.tags button:focus-visible{border-color:var(--sig-ink,var(--sig))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* output */
pre{margin:0;padding:12px;background:var(--field);border:1px solid var(--line-2);border-radius:var(--r);overflow:auto;font:12.5px/1.55 var(--mono);max-height:340px;white-space:pre-wrap;overflow-wrap:anywhere}
pre .add{color:var(--ok)} pre .del{color:var(--bad)} pre .hdr{color:var(--sig-ink)}
.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line-2)}
.member:last-child{border:0}
.avatar{width:36px;height:36px;display:grid;place-items:center;font:700 12px var(--mono);letter-spacing:.04em;background:var(--ink);color:var(--bg);flex:none}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.link-box{word-break:break-all;max-height:5.2em;overflow:hidden;padding:10px 12px;background:var(--field);border:1px dashed var(--sig);color:var(--sig-ink)}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r);padding:20px;max-width:min(420px,calc(100vw - 32px));box-shadow:var(--hard)}
dialog::backdrop{background:var(--scrim)}
dialog h2{color:var(--ink)}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:30;padding:0 14px}
@media (min-width:900px){.toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-left:4px solid var(--sig);padding:10px 16px;max-width:560px;font:600 11.5px var(--mono);letter-spacing:.04em;box-shadow:var(--hard)}
.toast.err{border-left-color:var(--bad)}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* witness hold */
.hold{display:none;gap:14px;align-items:flex-start;margin:4px 0 14px;padding:14px 16px;background:color-mix(in srgb,var(--sig) 10%,var(--panel));border:1px solid var(--sig);border-left-width:5px;border-radius:10px}
.hold.on{display:flex;animation:in .16s steps(4)}
.hold svg{width:28px;height:28px;flex:none;stroke:var(--sig-ink);fill:none;stroke-width:1.7;stroke-linecap:square}
.hold b{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sig-ink)}
.hold p{margin:3px 0 0;font-size:14px}
.hold code{font:600 12.5px var(--mono);background:var(--field);padding:1px 6px;border:1px solid var(--line-2)}

/* hash chain: one lit segment per entry */
.chain{display:flex;flex-wrap:wrap;gap:3px;margin:14px 0 6px}
.chain i{width:12px;height:22px;background:var(--ok-led);opacity:0;animation:blk .3s steps(3) forwards}
.chain i.bad{background:var(--bad)}
.chain i.dim{background:var(--dim)}
@keyframes blk{to{opacity:1}}
.chain-note{font:500 11.5px var(--mono);color:var(--mut);margin:0}
.verdict{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.verdict.ok{color:var(--ok);border-color:var(--ok)} .verdict.bad{color:var(--bad);border-color:var(--bad)}
.verdict span.mut{font-weight:500;text-transform:none;letter-spacing:0}
.evt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.evt:last-child{border:0}
.evt time{color:var(--mut);font:12px var(--mono);min-width:48px}

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = s => !s ? "" : s.length > 14 ? s.slice(0, 6) + "…" + s.slice(-4) : s;
const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const hue = s => { let h = 0; for (const c of s || "x") h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (id, label) => `<span class="avatar">${esc((label || id || "?").slice(0, 2).toUpperCase())}</span>`;

const ICONS = {
  room: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
  feed: '<path d="M4 5h16v11H9l-5 4z"/>',

  notes: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',

  proof: '<path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.100-8-4.500-8-9V6z"/><path d="M8.500 12l2.500 2.500 4.500-5"/>',
  canvas: '<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="6"/><rect x="13" y="11" width="8" height="10"/><rect x="3" y="13" width="8" height="8"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  rooms: '<circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><circle cx="19" cy="9" r="1.6"/><circle cx="6" cy="16.5" r="1.6"/>',
};
const TABS = [["room", "Room"], ["timeline", "Timeline"], ["notes", "Notes"], ["feed", "Feed"], ["work", "Work"], ["people", "People"], ["harnesses", "Harnesses"], ["proof", "Proof"]];

const S = {tab: "room", status: null, ok: false, feed: [], feedQ: "", feedBucket: "all", seq: 0, invite: null, hostArgs: {}, running: false, runInfo: null, runTimer: null, unread: 0, lastWork: null, verify: null, holds: [], hold: [], tamper: null};
const hasSelectionIn = el => { const sel = window.getSelection?.(); return !!(el && sel && !sel.isCollapsed && sel.anchorNode && el.contains(sel.anchorNode)); };

/* ---------- api ---------- */
const BASE = (location.pathname.match(/^\/r\/[^/]+\//) || ["/"])[0];     // under the hub a room lives at /r/<id>/
const HUB = BASE !== "/";
const RID = HUB ? BASE.split("/")[2] : "";
let ROOM = "";       // the room's name, from the hub (a standalone cockpit has none)
const qn = () => ROOM ? `“${esc(ROOM)}”` : "";
const gfetch = (u, i) => typeof PB !== "undefined" ? PB.guarded(u, i) : fetch(u, i);
async function api(name, args = {}, poll = false) {
  let r;
  try {
    r = await gfetch(BASE + "api/tool", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name, args, poll})});
  } catch (e) { return {error: true, data: e && e.message && e.message.includes("passkey") ? e.message : "Can't reach the Playbox UI server."}; }
  if (r.status === 401) { if (HUB) location.href = "/"; else location.reload(); return {error: true, data: "Locked"}; }
  return r.json();
}
const msgOf = d => typeof d === "string" ? d : (d && (d.error || d.message)) || JSON.stringify(d);

function toast(text, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = text;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3200);
}

/* ---------- derived state ---------- */
const hosting = () => S.status && S.status.hosting;
const joined = () => S.status && S.status.joined;
const myId = () => (joined() && joined().member_id) || (S.status && S.status.guest_id) || "";
const members = () => (hosting() && hosting().members) || [];
function mode() { return hosting() && joined() ? "both" : hosting() ? "host" : joined() ? "guest" : "none"; }

function paintPill() {
  const m = mode();
  const txt = !S.ok ? "Offline" : m === "none" ? "No room" : m === "guest" ? "In a room" : `Hosting · ${members().length} member${members().length === 1 ? "" : "s"}`;
  const cls = m === "none" || !S.ok ? "" : m === "guest" ? "on" : "host";
  const pill = $("#pill"); pill.title = txt;
  pill.innerHTML = `<span class="dot ${cls}"></span><span>${esc(txt)}</span>`;
  $("#railfoot").innerHTML = `<span class="dot ${cls}" style="display:inline-block;margin-right:7px"></span>${esc(txt)}`;
}

function cockpitPaletteItems() {
  return [["room", "Room"], ["feed", "Feed"], ["work", "Work"], ["notes", "Notes"], ["timeline", "Timeline"], ["harnesses", "Harnesses"], ["people", "People"], ["proof", "Proof"]].map(([id, label]) => ({
    label: `Cockpit: ${label}`,
    t: `Cockpit: ${label}`,
    title: `Cockpit: ${label}`,
    sub: ROOM ? `${ROOM} tab` : "Cockpit tab",
    s: ROOM ? `${ROOM} tab` : "Cockpit tab",
    hint: "Tab",
    act: () => show(id),
    run: () => show(id),
    action: () => show(id),
  }));
}
function openCockpitPalette() {
  if (window.PBShell && PBShell.openPalette) PBShell.openPalette(cockpitPaletteItems());
}
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && window.PBShell && PBShell.openPalette) {
    e.preventDefault();
    PBShell.openPalette(cockpitPaletteItems());
    return;
  }
  if (e.key === "Escape" && S.tlDrill != null && !document.querySelector("dialog[open]")) {
    S.tlDrill = null; show("timeline"); return;
  }
  if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey && S.tab === "feed" && !document.querySelector("dialog[open]") && !e.target.matches?.("input,textarea,select,[contenteditable=true]")) {
    const fq = $("#feedq");
    if (fq) { e.preventDefault(); fq.focus(); fq.select(); }
  }
});

function switcherMarkup() {
  if (window.PBShell && PBShell.switcherHtml) return PBShell.switcherHtml(RID, "cockpit");
  return `<span class="seg" style="min-height:28px"><a href="${BASE}canvas" style="display:inline-flex;align-items:center;padding:0 9px;min-height:28px;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--mut)">Canvas</a><span style="display:inline-flex;align-items:center;padding:0 9px;min-height:28px;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg)">Cockpit</span></span>`;
}
function paintRoomTools() {
  if (!HUB) return;
  const tools = `<span style="flex:1;display:flex;align-items:center">${switcherMarkup()}</span><button type="button" class="iconbtn" data-act="palette" title="Search / Jump (⌘K)" aria-label="Search or jump"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.search}</svg></button><button type="button" class="iconbtn" data-act="settings" title="Settings (⌘,)" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.settings}</svg></button>`;
  const rt = $("#railtools"), tt = $("#toptools");
  if (rt) { rt.hidden = false; rt.innerHTML = tools; }
  if (tt) { tt.hidden = false; tt.innerHTML = tools; }
}

function paintNav() {
  const railHtml = TABS.map(([id, label]) => {
    const badge = id === "feed" && S.unread ? `<span class="badge" aria-label="${S.unread} new">${S.unread > 9 ? "9+" : S.unread}</span>` : "";
    return `<button class="nav" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg><span>${label}</span>${badge}</button>`;
  }).join("");
  const unreadBadge = S.unread ? `<span class="badge" aria-label="${S.unread} new">${S.unread > 9 ? "9+" : S.unread}</span>` : "";
  const moreActive = ["room", "timeline", "people", "harnesses", "proof"].includes(S.tab) && (HUB || S.tab !== "room");
  const fourth = HUB
    ? `<a class="nav" href="${BASE}canvas" style="text-decoration:none"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.canvas}</svg><span>Canvas</span></a>`
    : `<button class="nav" data-tab="room" ${S.tab === "room" ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.room}</svg><span>Room</span></button>`;
  const mobileHtml = `<button class="nav" data-tab="feed" ${S.tab === "feed" ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.feed}</svg><span>Feed</span>${unreadBadge}</button>`
    + `<button class="nav" data-tab="work" ${S.tab === "work" ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.work}</svg><span>Work</span></button>`
    + `<button class="nav" data-tab="notes" ${S.tab === "notes" ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.notes}</svg><span>Notes</span></button>`
    + fourth
    + `<button class="nav" data-act="moretabs" ${moreActive ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.more}</svg><span>More</span></button>`;
  $("#tabbar").innerHTML = mobileHtml;
  $("#railnav").innerHTML = railHtml;
}

function openMoreTabs() {
  const d = $("#dlg"); d.onclose = null;
  const extraTabs = [...(HUB ? [["room", "Room"]] : []), ["timeline", "Timeline"], ["harnesses", "Harnesses"], ["people", "People"], ["proof", "Proof"]];
  d.innerHTML = `<div><div class="row" style="justify-content:space-between"><h2 style="color:var(--ink);font-size:13px">More in ${esc(ROOM || "Room")}</h2><button type="button" class="btn sm" data-mclose>Close</button></div>
    <div class="msheet">
      ${extraTabs.map(([id, label]) => `<button type="button" data-mtab="${id}" ${S.tab === id ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg><span>${label}</span></button>`).join("")}
      ${HUB ? `<a href="/"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.rooms}</svg><span>All rooms</span><small>Hub</small></a>` : ""}
      ${window.PBTheme ? `<button type="button" data-mset><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.settings}</svg><span>Settings</span><small>⌘,</small></button>` : ""}
    </div></div>`;
  d.onclick = ev => {
    if (ev.target === d || ev.target.closest("[data-mclose]")) { d.close(); return; }
    const b = ev.target.closest("[data-mtab]");
    if (b) { d.close(); show(b.dataset.mtab); return; }
    if (ev.target.closest("[data-mset]")) { d.close(); window.PBTheme && PBTheme.open(); }
  };
  d.showModal();
}


/* ---------- built-in use cases ---------- */
const NO_GIT = '-path ./.git -prune -o';
const NEED = (tool, why) => `command -v ${tool} >/dev/null 2>&1 || { echo "${tool} is not in the host's task image (${why}). Ask the host to allow an image that has it."; exit 0; }`;
const RECIPES = [
  {t: "Run the tests", d: "npm, cargo, pytest or go, if the host's image has it.", cmd: `if [ -f package.json ]; then ${NEED("npm", "node project")}; npm test --silent; elif [ -f Cargo.toml ]; then ${NEED("cargo", "rust project")}; cargo test --quiet; elif [ -f pyproject.toml ] || [ -f setup.py ] || [ -f requirements.txt ]; then ${NEED("python3", "python project")}; python3 -m pytest -q; elif [ -f go.mod ]; then ${NEED("go", "go project")}; go test ./...; else echo "No package.json, Cargo.toml, Python or go.mod project file found."; fi`},
  {t: "Find TODOs", d: "Leftover TODO and FIXME notes, first 60 lines.", cmd: `grep -rIn -E "TODO|FIXME" . 2>/dev/null | grep -v '^\\./\\.git/' | head -n 60; echo "TODO scan finished"`},
  {t: "Look for leaked secrets", d: "Cloud keys, private keys and tokens in any file.", cmd: `grep -rIEn "AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{24,}" . 2>/dev/null | grep -v '^\\./\\.git/' | cut -c1-140 | head -n 20; echo "secret scan finished"`},
  {t: "Largest files", d: "The 12 biggest files, in bytes.", cmd: `find . ${NO_GIT} -type f -exec wc -c {} + | sort -rn | head -n 13`},
  {t: "File types", d: "How many files of each extension.", cmd: `find . ${NO_GIT} -type f -print | sed -n 's/.*\\.//p' | sort | uniq -c | sort -rn | head -n 12; echo; echo "files: $(find . ${NO_GIT} -type f -print | wc -l)"`},
  {t: "Check shell scripts", d: "Syntax-check every .sh file with sh -n.", cmd: `n=0; for f in $(find . ${NO_GIT} -name '*.sh' -type f -print); do n=$((n+1)); if sh -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fi; done; echo "$n script(s) checked"`},
];
const QUICK = ["On it", "Pushed my branch, ready for review", "Tests pass on the host", "Blocked, need input", "Looks good to me"];
const PRESETS = [
  {t: "SWE template", reach: "iroh", docker: true, template: "swe"},
  {t: "Research template", reach: "iroh", docker: true, template: "research"},
  {t: "Review template", reach: "iroh", docker: true, template: "review"},
  {t: "Ops template", reach: "iroh", docker: true, template: "ops"},
  {t: "Pair on my network", reach: "local", docker: false, template: ""},
];

/* ---------- rooms sidebar and status bar (hub only) ---------- */
async function loadRailRooms() {
  if (!HUB || !window.PBShell) return;
  try { const d = await (await fetch("/api/rooms", {credentials: "same-origin"})).json(); PBShell.sync(d.rooms || [], BASE.split("/")[2], $("#railrooms")); PBShell.start(); } catch {}
}
if (HUB) { loadRailRooms(); setInterval(() => { if (!document.hidden) loadRailRooms(); }, 30000); }

/* ---------- instrument panels (Stats, Activity, Trail) ---------- */
const INS_ICON = {
  stats: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" style="color:var(--mut)"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>',
  activity: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" style="color:var(--mut)"><path d="M4 7h16M4 12h11M4 17h7"/></svg>',
  trail: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" style="color:var(--mut)"><path d="M5 5h14v14H5z"/><path d="M8 10l3 2-3 2M13 14h3"/></svg>'};
S.ins = S.ins || {};
try { const k = "pb.seen." + BASE, v = +localStorage.getItem(k) || 0; S.since = v; if (!v) localStorage.setItem(k, String(Date.now())); } catch { S.since = 0; }
function markSeen() { S.since = Date.now(); try { localStorage.setItem("pb.seen." + BASE, String(S.since)); } catch {} }
document.addEventListener("click", e => {
  if (e.target.closest("[data-markread]")) { markSeen(); paintInsights(); return; }
  const k = e.target.closest("#insights [data-kind]");
  if (k) { e.preventDefault(); S.trailKind = S.trailKind === k.dataset.kind ? null : k.dataset.kind; S.ins.trail = true; paintInsights(); document.querySelector("[data-ins=trail]")?.scrollIntoView({block: "nearest", behavior: "smooth"}); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches?.("#insights [role=button]")) e.target.click(); });
function kindOf(it) {
  if (it.kind === "say" && typeof it.text === "string" && (it.text.startsWith("::pbx identity ") || it.text.startsWith("::pbx launch "))) return "identity";
  if (it.kind === "say") return "say";
  const ev = String((it.meta && it.meta.event) || "").toLowerCase();
  const t = String(it.text || "").toLowerCase();
  if (ev === "task" || t.startsWith("task ")) return "task";
  if (ev === "join" && it.meta && it.meta.ok === false) return "refused";
  return t === "join ok" || (ev === "join" && it.meta && it.meta.ok === true) ? "join" : ev === "refused" || t.startsWith("refused") || t === "join failed" ? "refused" : "event";
}
function fmtDur(ms) {
  if (typeof ms !== "number" || !Number.isFinite(ms) || ms < 0) return "";
  if (ms < 1000) return `${Math.round(ms)}ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
  const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
  return `${m}m ${s}s`;

  try { const r = await fetch(BASE + "api/canvas", {cache: "no-store", credentials: "same-origin"}); S.hx = r.ok ? await r.json() : {members: []}; } catch { S.hx = S.hx || {members: []}; }
  if (HUB && !S.local) { try { const r = await fetch("/api/agents", {credentials: "same-origin"}); if (r.ok) S.local = (await r.json()).agents || []; } catch {} }
  if (S.tab === "harnesses") show("harnesses", !!soft);
}
const HX_NONE = "Unidentified";
function launchChip(m) {
  const l = m.launch; if (!l) return "";
  return `<span class="chip ok" title="The host signed that it started this key with ${esc(l.harness)}${l.model ? " " + esc(l.model) : ""}">host-observed ${esc(l.harness)}</span>${m.launch_differs ? ' <span class="chip bad" title="The member\'s card claims a different harness or model than the host recorded">card differs from host record</span>' : ""}`;
}
function idBadge(m) {
  if (m.identity === "signed" && m.endorsement === "changed") return `<span class="chip bad" title="You endorsed an earlier card. This one is different: check it, then endorse again.">endorsed, card changed</span>`;
  if (m.identity === "signed" && m.endorsement === "endorsed") return `<span class="chip" style="color:var(--blue);border-color:var(--blue-edge)" title="You vouched for this card in this room">endorsed by you</span> <span class="chip ok">signed</span>`;
  if (m.identity === "signed") return `<span class="chip ok" title="A card signed by this member's own key, bound to this room, valid until ${esc(new Date((m.card || {}).expires_ms || 0).toLocaleString())}">signed</span>${m.dup_name ? ' <span class="chip bad" title="Another key in this room uses the same name">name used twice</span>' : ""}`;
  if (m.identity === "expired") return '<span class="chip warn" title="The signed card ran out. The agent should announce again.">card expired</span>';
  return '<span class="chip warn" title="No verified card: nothing this member typed is shown as its identity">unidentified</span>';
}
function harnessesView() {

  const machines = new Set(ms.map(m => m.machine).filter(Boolean)).size, online = ms.filter(m => m.present).length, named = ms.filter(m => m.identity === "signed").length;

    [["Harnesses", String(keys.filter(k => k !== HX_NONE).length)], ["Machines", String(machines)], ["Signed cards", `${named} of ${ms.length}`], ["Endorsed", String(ms.filter(m => m.endorsement === "endorsed").length)], ["Unsigned", String(ms.length - named)], ["Models", String(new Set(ms.map(m => m.model).filter(Boolean)).size)]]);
  const row = m => `<div class="hxr"><i class="sd ${m.present ? "live" : ""}" title="${m.present ? "present" : "away"}"></i><span class="nm">${esc(m.name_verified ? m.name : short(m.id))}${m.me ? ' <span class="chip">you</span>' : ""} ${idBadge(m)} ${launchChip(m)}<small>${m.name_verified ? esc(m.role || "") : m.claim && (m.claim.name || m.claim.harness) ? "unsigned claim, not verified: " + esc([m.claim.name, m.claim.harness].filter(Boolean).join(" · ")) : "no signed card"}</small></span>
      <span class="mono mut">${esc(m.model || "")}</span><span class="mut">${esc(m.machine || "")}</span><span class="mono mut">${m.msgs} msg</span><button type="button" class="tbtn" data-grant="${esc(m.id)}" aria-expanded="${S.hxopen === m.id}">Details</button>${m.identity === "signed" && !m.me ? (m.endorsement === "endorsed" ? `<button type="button" class="tbtn" data-unendorse="${esc(m.id)}">Remove</button>` : `<button type="button" class="tbtn" data-endorse="${esc(m.id)}">${m.endorsement === "changed" ? "Endorse again" : "Endorse"}</button>`) : ""}<span class="mono mut">${m.last_seen ? esc(PBI.span(now - m.last_seen)) + " ago" : ""}</span></div>`;
  const idBlock = m => { const c = m.card || {}, hist = (d.changelog || []).filter(x => x.type === "identity" && x.who === m.id).slice(0, 8);
    return `<table class="kvt"><tr><td class="k">key</td><td class="mono" style="word-break:break-all">${esc(m.id)}</td></tr>
      <tr><td class="k">did:key</td><td class="mono" style="word-break:break-all">${esc(m.did || "none: no verified card")}</td></tr>
      <tr><td class="k">identity</td><td>${idBadge(m)}${c.expires_ms ? ` valid until ${esc(new Date(c.expires_ms).toLocaleString())}` : ""}</td></tr>
      <tr><td class="k">host record</td><td>${m.launch ? `host-observed: ${esc(m.launch.harness)}${m.launch.model ? " · " + esc(m.launch.model) : ""}${m.launch.image ? ` · <span class="mono">${esc(m.launch.image)}</span>` : ""}, started ${esc(new Date(m.launch.started_ms).toLocaleString())}` : '<span class="mut">none: harness and model are claimed by the agent, not observed</span>'}</td></tr>
      ${m.ans ? `<tr><td class="k">ans name</td><td class="mono">${esc(m.ans)} ${m.ans_status === "registered" ? `<span class="chip ok" title="A transparency-log receipt for this name was checked offline against the log key you pinned. It does not prove this agent holds the name.">registered in the log</span>${m.ans_proof ? `<div class="mut" style="font-size:12px">leaf ${esc(m.ans_proof.leaf_hash.slice(0, 16))}… · log key ${esc(m.ans_proof.kid)} · checked ${esc(new Date(m.ans_proof.at * 1000).toLocaleString())} <button type="button" class="tbtn" data-ansrm="${esc(m.id)}">Remove</button></div>` : ""}` : `<span class="mut">${m.ans_status === "changed" ? "the card now names a different ANS name than the receipt you checked" : "claimed, not checked"}</span> ${m.identity === "signed" && !m.me ? `<button type="button" class="tbtn" data-ansform="${esc(m.id)}">Check a receipt</button>` : ""}`}${S.ansform === m.id ? `<div class="ansf"><p class="mut" style="margin:6px 0">Paste the receipt (base64, from <span class="mono">/v1/agents/ID/receipt</span>) and the log's public key (PEM, or a line from <span class="mono">/root-keys</span>). It is checked here, offline. A good result means the log you trust recorded this name; it does not prove this agent holds it.</p><textarea id="ansrc" rows="3" class="in" placeholder="receipt (base64)" style="width:100%"></textarea><textarea id="anskey" rows="3" class="in" placeholder="log public key" style="width:100%;margin-top:6px"></textarea><button type="button" class="btn sm" data-anssend="${esc(m.id)}" style="margin-top:6px">Check receipt</button></div>` : ""}</td></tr>` : ""}
      <tr><td class="k">card history</td><td>${hist.length ? hist.map(x => `<div>${esc(new Date(x.ms).toLocaleString())} · ${esc(x.text)}</div>`).join("") : '<span class="mut">no card seen</span>'}</td></tr></table>`; };
  const drawer = m => { if (S.hxopen !== m.id) return ""; const g = m.grant; if (!g) return `<div class="hxd">${idBlock(m)}</div>`; const left = g.expires * 1000 - now;
    const allowed = (g.allowed || []).filter(x => x); const kinds = {host: [], secret: [], cap: []};
    for (const a of allowed) { const [t, ...r] = a.split("/"); (t === "secret" || t === "cap" ? kinds[t] : kinds.host).push(t === "secret" || t === "cap" ? r.join("/") : a); }
    return `<div class="hxd">${idBlock(m)}<div class="chain"><span class="mono">host</span><i>→</i><span class="mono">${esc(short(m.id))}</span><span class="mut">via link ${esc(g.invite)}</span></div>
      <table class="kvt"><tr><td class="k">issued</td><td>${esc(new Date(g.issued * 1000).toLocaleString())}</td></tr>
      <tr><td class="k">expires</td><td>${left > 0 ? `in ${esc(PBI.span(left))}` : '<span class="chip warn">expired</span>'} · ${esc(new Date(g.expires * 1000).toLocaleString())}</td></tr>
      <tr><td class="k">limits</td><td>${(g.cpu_milli / 1000).toFixed(1)} cpu · ${g.mem_mib} MiB · ${g.timeout_secs}s per task · network ${g.net ? "on" : "off"}</td></tr>
      <tr><td class="k">hosts</td><td>${kinds.host.length ? esc(kinds.host.join(", ")) : "none"}</td></tr>
      <tr><td class="k">secrets</td><td>${kinds.secret.length ? esc(kinds.secret.join(", ")) : "none"}</td></tr>
      <tr><td class="k">capabilities</td><td>${kinds.cap.length ? esc(kinds.cap.join(", ")) : "none"}</td></tr></table>
      <p class="mut" style="font-size:12.5px;margin:8px 0 0">The grant is bound to this key, lasts at most this long, and can only be narrowed by whoever holds it. The token itself is never shown. ${S.hx.admin ? `<button type="button" class="btn sm danger" data-revoke="${esc(m.id)}">Revoke this member</button>` : ""}</p></div>`; };
  const cards = keys.map(k => `<div class="card hx"><h2>${esc(k)} <span class="mut" style="font-weight:400">· ${groups.get(k).length}</span></h2>${groups.get(k).map(m => row(m) + drawer(m)).join("")}</div>`).join("");

  const how = `<div class="card"><h2>Show up here</h2><p class="mut" style="margin:0 0 10px">An agent proves who it is with a card signed by its own key: call <span class="mono">playbox_announce</span> after joining and again after reconnecting (a card lasts at most 24 hours). Names and harness from unsigned messages are never shown as identity. A signed card proves the key said it, not that the harness is real.</p><pre class="src" style="margin:0">playbox_announce {"name":"Haiku-1","machine":"studio","role":"hill climber","harness":"Hermes","model":"claude-haiku-5-5"}</pre></div>`;
  return head + (ms.length ? `<div class="wk">${cards}</div>` : `<div class="card empty"><p>Nobody has joined yet.</p></div>`) + `<div class="wk">${local}${how}</div>`;
}
document.addEventListener("click", async e => {
  const gb = e.target.closest("[data-grant]");
  if (gb) { S.hxopen = S.hxopen === gb.dataset.grant ? null : gb.dataset.grant; return show("harnesses"); }
  const rv = e.target.closest("[data-revoke]");
  if (rv) {
    if (!confirm("Revoke this member? Their grant stops working at once and their key can't rejoin.")) return;
    rv.disabled = true;
    const r = await api("playbox_revoke", {member: rv.dataset.revoke});
    if (r.error) toast(msgOf(r.data), true); else toast("Member revoked");
    S.hxopen = null; return loadHarnesses();
  }
  const af = e.target.closest("[data-ansform]"); if (af) { S.ansform = S.ansform === af.dataset.ansform ? null : af.dataset.ansform; return show("harnesses"); }
  const as = e.target.closest("[data-anssend],[data-ansrm]");
  if (as) {
    as.disabled = true;
    try {
      const add = !!as.dataset.anssend, key = as.dataset.anssend || as.dataset.ansrm;
      const r = await gfetch(BASE + (add ? "api/ans" : "api/ans/" + key), {method: add ? "POST" : "DELETE", headers: {"Content-Type": "application/json"}, body: add ? JSON.stringify({key, receipt: $("#ansrc").value, pubkey: $("#anskey").value}) : undefined});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      toast(add ? "Receipt checked: name registered in the log" : "Receipt removed"); S.ansform = null;
    } catch (er) { toast(String(er.message || er), true); }
    return loadHarnesses();
  }
  const b = e.target.closest("[data-endorse],[data-unendorse]"); if (!b) return;
  const add = !!b.dataset.endorse, key = b.dataset.endorse || b.dataset.unendorse;
  b.disabled = true;
  try {
    const r = await gfetch(BASE + (add ? "api/endorse" : "api/endorse/" + key), {method: add ? "POST" : "DELETE", headers: {"Content-Type": "application/json"}, body: add ? JSON.stringify({key}) : undefined});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    toast(add ? "Endorsed in this room" : "Endorsement removed");
  } catch (er) { toast(String(er.message || er), true); }
  await loadHarnesses();
});
setInterval(() => { if (S.tab === "harnesses" && !document.hidden) loadHarnesses(true); }, 15000);

/* ---------- Work and Proof headers ---------- */

  return `<div class="rh"><div class="rh1"><div><div class="rt">${esc(title)}</div><div class="rs">${esc(sub)}</div></div><div class="hns">${nums.map(([k, v]) => `<div class="hn"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></div>
    <div class="rh2">${meta.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></div>`;
}
function workHeader(w) {
  const r = w && (w.result || w);
  const code = r && (r.exit_code ?? r.code), ok = code === 0;
  return stripHtml("Work", ROOM ? `in ${ROOM}` : "pull code, run tasks in the host's sandbox", [["LAST EXIT", r ? String(code ?? "—") : "—"], ["STATE", S.running ? "running" : r ? (ok ? "passed" : "failed") : "idle"]],
    [["Role", "guest"], ["Folder", (S.status && (S.status.workspace || (joined() || {}).workspace)) || "—"], ["Recipes", String(RECIPES.length)], ["Sandbox", "host's task image"]]);
}
function proofHeader(v, t) {
  const log = S.status && S.status.history_log;

    [["Log", log ? log.split("/").slice(-1)[0] : "—"], ["Tamper test", t ? (t.caught || t.valid === false ? "caught" : "ran") : "not run"], ["Witness holds", String((S.hold || []).length)], ["Mode", mode()]]);

async function ensureRepos() {

    if (r.ok) { const j = await r.json(); S.repos = j.repos || []; }

function emptyCard(t) { return `<div class="card empty"><span class="glyph" style="display:block;width:20px;height:20px;margin:0 auto 12px;background:var(--sig)"></span><p>${esc(t)}</p></div>`; }

const ORIGIN = {"room:feed": "the room feed", "room:delegate": "a delegated task result", "room:recall": "shared room memory",
  "room:steer": "a steering message", "room:memory_ingest": "ingested memory", "room:memory_export": "exported memory", "room workspace file": "a file from a peer's workspace"};

function chain(total, brokenAt) {
  const N = Math.min(total, 48), per = total / N;
  const bad = brokenAt == null ? -1 : Math.min(N - 1, Math.floor(brokenAt / per));
  let h = "";
  for (let k = 0; k < N; k++) h += `<i class="${bad < 0 ? "" : k === bad ? "bad" : k > bad ? "dim" : ""}" style="animation-delay:${k * 14}ms"></i>`;
  return `<div class="chain" role="img" aria-label="${bad < 0 ? "Every entry links to the one before" : "The chain breaks at entry " + brokenAt}">${h}</div>
    <p class="chain-note">${total} entries${per > 1.5 ? `, each block is about ${Math.round(per)}` : ""}. Each one holds the hash of the entry before it.</p>`;
}

function renderTamper(t) {
  if (t.error && !t.entries) return `<div class="verdict bad">${esc(t.error)}</div>`;
  const m = /entry (\d+)/.exec(t.message || "");
  const at = m ? +m[1] : null;
  return `${chain(t.entries, at == null ? Math.floor(t.entries / 2) : at)}
    <div class="verdict ${t.valid ? "ok" : "bad"}">${t.valid ? "✓ Still valid (the flipped byte was not covered)" : `✕ Caught${at != null ? ` at entry ${at}` : ""}`}
      <span class="mut">byte ${t.offset} of ${t.bytes} flipped in a copy</span></div>
    ${t.message && !t.valid ? `<pre style="margin-top:10px">${esc(t.message)}</pre>` : ""}`;
}

function renderHolds() {
  const ev = S.holds.slice(-8).reverse();
  if (!ev.length) return `<p class="mut" style="margin:0">No holds yet. When the witness plugin pauses your Hermes agent after it reads another member's text, it shows here. Only the tool name and where the text came from are kept, never the text.</p>`;
  return ev.map(e => {
    const chip = e.kind === "held" ? '<span class="chip warn">held</span>' : e.kind === "denied" ? '<span class="chip bad">denied</span>' : '<span class="chip ok">released</span>';
    const desc = e.kind === "held" ? `<span class="mono">${esc(e.tool || "")}</span> <span class="mut">after ${esc(originText(e.origin))}</span>`
      : e.kind === "denied" ? `<span class="mut">you denied it from Playbox</span>`
      : e.by === "owner" ? `<span class="mut">you lifted the hold in Playbox</span>`
      : `<span class="mut">your next message lifted it</span>`;
    return `<div class="evt"><time>${esc(hhmm(e.ts))}</time>${chip}<span class="grow">${desc}</span></div>`;
  }).join("");
}

function renderVerify(v) {
  const ok = v.valid === true;
  return `${v.entries != null && ok ? chain(v.entries) : ""}
    <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "✓ Chain valid" : "✕ Not valid"}
      ${v.entries != null ? `<span class="mut">${v.entries} entries${v.head ? " · head " + esc(short(v.head)) : ""}</span>` : ""}</div>
    ${(v.problems || []).length ? `<pre style="margin-top:10px">${esc(v.problems.join("\n"))}</pre>` : ""}
    ${v.error ? `<pre style="margin-top:10px">${esc(v.error)}</pre>` : ""}`;
}

function colorDiffLines(lines) {
  return lines.map(l => {
    const c = l.startsWith("+++") || l.startsWith("---") || l.startsWith("diff") || l.startsWith("@@") || l.startsWith("index ") ? "hdr" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
  }).join("\n");
}
function parseDiffSections(src) {
  const lines = src.split("\n"), secs = [];
  let cur = null, pre = [];
  for (const l of lines) {
    if (l.startsWith("diff --git ")) {
      if (cur) secs.push(cur);
      cur = pre.length ? [...pre, l] : [l];
      pre = [];
    } else if (cur) cur.push(l);
    else if (l) pre.push(l);
  }
  if (cur) secs.push(cur);
  return secs.map(sec => {
    const hdr = sec.find(l => l.startsWith("diff --git ")) || sec[0] || "";
    const plus = sec.find(l => l.startsWith("+++ b/"));
    const minus = sec.find(l => l.startsWith("--- a/"));
    const m = /^diff --git "?a\/(.+?)"? "?b\/(.+?)"?$/.exec(hdr);
    const filePath = plus ? plus.slice(6) : m ? m[2] : minus ? minus.slice(6) : hdr.replace(/^diff --git\s+/, "");
    let adds = 0, dels = 0;
    for (const l of sec) {
      if (l.startsWith("+") && !l.startsWith("+++")) adds++;
      else if (l.startsWith("-") && !l.startsWith("---")) dels++;
    }
    return {filePath, adds, dels, lines: sec};
  });
}

  if (/(?:^|\n)diff --git /.test(src)) {

    const totAdds = secs.reduce((a, s) => a + s.adds, 0), totDels = secs.reduce((a, s) => a + s.dels, 0);
    return `<div class="row" style="justify-content:space-between;margin:14px 0 6px;gap:8px">

function copyText(t) {
  const done = () => toast("Copied");
  if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch { toast("Select the link and copy it by hand.", true); }
    ta.remove();
  }
}

  if (fbBtn) {
    S.feedBucket = fbBtn.dataset.fbucket;
    document.querySelectorAll("[data-fbucket]").forEach(b => b.classList.toggle("on", b.dataset.fbucket === S.feedBucket));
    paintFeed(false);
    return;
  }
  if (e.target.closest("#feedqclear")) {
    S.feedQ = "";
    const fq = $("#feedq");
    if (fq) { fq.value = ""; fq.focus(); }
    paintFeed(false);
    return;
  }
  if (e.target.closest('a[href$="/canvas"]')) window.PBShell?.setRoomView?.("canvas");
  const t = e.target.closest("[data-tab],[data-act],[data-reach]");
  if (!t) return;
  if (t.dataset.tab) return show(t.dataset.tab);
  if (t.dataset.reach) { document.querySelectorAll("[data-reach]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (t.dataset.act === "tag") return insertTag(t.dataset.tag);
  if (t.dataset.act === "revoke") return confirmRevoke(t.dataset.id);
  if (t.dataset.act === "moretabs") return openMoreTabs();
  if (t.dataset.act === "palette") return openCockpitPalette();
  if (t.dataset.act === "settings") { window.PBTheme && PBTheme.open(); return; }
  act(t.dataset.act, t);
});
document.addEventListener("input", e => {
  if (e.target.id === "saytext") paintTags();
  else if (e.target.id === "feedq") { S.feedQ = e.target.value; paintFeed(false); }
});
document.addEventListener("keyup", e => { if (e.target.id === "saytext" && /Arrow|Home|End/.test(e.key)) paintTags(); });
document.addEventListener("submit", async e => {
  if (e.target.id !== "say") return;
  e.preventDefault();
  const inp = $("#saytext"), text = inp.value.trim();
  if (!text) return;
  if (S.offline) { toast("The host is offline, so nothing can be posted.", true); return; }
  inp.value = ""; paintTags();
  const r = await api("playbox_say", {text});
  if (r.error) { inp.value = text; return toast(msgOf(r.data), true); }
  pollFeed();
});

/* ---------- boot ---------- */
paintRoomTools(); paintNav(); paintPulse();
const _qs = new URLSearchParams(location.search);
const _initTab = TABS.some(([id]) => id === _qs.get("tab")) ? _qs.get("tab") : "room";
if (_qs.get("drill")) S.tlDrill = _qs.get("drill");
refresh().then(async () => { if (_initTab === "timeline") await pollFeed(); show(_initTab); }); pollWitness();
let tick = 0;
setInterval(() => {
  if (document.hidden) return;
  tick++;
  pollWitness();
  if (tick % 3 === 0) refresh(true);                       // every call is appended to the signed history, so poll gently
  if (S.tab === "feed" || S.tab === "room" || S.tab === "timeline" || S.tab === "people" || innerWidth >= 1220) pollFeed();
}, 3500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(true); pollFeed(); } });
</script>
